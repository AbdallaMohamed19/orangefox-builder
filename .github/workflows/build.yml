name: Build OrangeFox - Redmi Note 10 Mojito

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      FOX_PATH: ${{ github.workspace }}/orangefox

    steps:

      # =========================================================
      # 1. Checkout this repository
      # =========================================================

      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Free GitHub runner disk space
      # =========================================================

      - name: Free disk space
        run: |
          set -euxo pipefail

          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo docker system prune -af || true

          echo "Disk after cleanup:"
          df -h


      # =========================================================
      # 3. Install build dependencies
      # =========================================================

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git lfs install

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          git config --global color.ui false


      # =========================================================
      # 4. Install repo
      # =========================================================

      - name: Install repo
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"


      # =========================================================
      # 5. Clone OrangeFox sync tools
      # =========================================================

      - name: Clone OrangeFox sync tools
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf OrangeFox_sync

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            OrangeFox_sync

          chmod +x \
            OrangeFox_sync/sync/orangefox_sync.sh


      # =========================================================
      # 6. Sync OrangeFox 12.1
      # =========================================================

      - name: Sync OrangeFox 12.1
        run: |
          set -euxo pipefail

          rm -rf "$FOX_PATH"

          mkdir -p "$FOX_PATH"

          cd "$GITHUB_WORKSPACE/OrangeFox_sync/sync"

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$FOX_PATH"


      # =========================================================
      # 7. Check OrangeFox source
      # =========================================================

      - name: Check OrangeFox source
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "======================================"
          echo "OrangeFox source"
          echo "======================================"

          test -d build
          test -d bootable/recovery
          test -d vendor/recovery

          echo "OrangeFox source OK."

          echo ""
          echo "Disk usage:"
          du -sh "$FOX_PATH" || true


      # =========================================================
      # 8. Clone Mojito device tree
      # =========================================================

      - name: Clone Mojito device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          rm -rf device/xiaomi/mojito

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_mojito.git \
            device/xiaomi/mojito


      # =========================================================
      # 9. Clone SM6150 common tree
      # =========================================================

      - name: Clone SM6150 common tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          rm -rf device/xiaomi/sm6150-common

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_sm6150-common.git \
            device/xiaomi/sm6150-common


      # =========================================================
      # 10. Clone Mojito kernel
      # =========================================================

      - name: Clone Mojito kernel
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          rm -rf kernel/xiaomi/mojito

          mkdir -p kernel/xiaomi

          git clone \
            --depth=1 \
            https://github.com/nebrassy/android_kernel_xiaomi_mojito.git \
            kernel/xiaomi/mojito


      # =========================================================
      # 11. Verify device tree
      # =========================================================

      - name: Verify device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "======================================"
          echo "MOJITO DEVICE TREE"
          echo "======================================"

          test -f device/xiaomi/mojito/BoardConfig.mk
          test -f device/xiaomi/mojito/twrp_mojito.mk
          test -f device/xiaomi/mojito/AndroidProducts.mk
          test -f device/xiaomi/mojito/device.mk

          echo ""
          echo "BoardConfig:"
          cat device/xiaomi/mojito/BoardConfig.mk

          echo ""
          echo "Product:"
          cat device/xiaomi/mojito/twrp_mojito.mk

          echo ""
          echo "Dependencies:"
          cat device/xiaomi/mojito/twrp.dependencies || true


      # =========================================================
      # 12. Verify kernel
      # =========================================================

      - name: Verify kernel
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "======================================"
          echo "MOJITO KERNEL"
          echo "======================================"

          test -d kernel/xiaomi/mojito

          test -f kernel/xiaomi/mojito/Makefile

          echo "Kernel found."

          echo ""
          echo "Kernel size:"
          du -sh kernel/xiaomi/mojito


      # =========================================================
      # 13. Prepare build environment
      # =========================================================

      - name: Prepare build environment
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "======================================"
          echo "Loading build environment"
          echo "======================================"

          source build/envsetup.sh

          echo ""
          echo "======================================"
          echo "Testing lunch target"
          echo "======================================"

          lunch twrp_mojito-eng

          echo ""
          echo "Lunch completed."

          echo ""
          echo "TARGET_PRODUCT=$TARGET_PRODUCT"
          echo "TARGET_DEVICE=$TARGET_DEVICE"


      # =========================================================
      # 14. Build OrangeFox
      # =========================================================

      - name: Build OrangeFox Recovery
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          lunch twrp_mojito-eng

          echo ""
          echo "======================================"
          echo "STARTING BUILD"
          echo "======================================"

          mka recoveryimage


      # =========================================================
      # 15. Show output
      # =========================================================

      - name: Show build output
        if: always()
        run: |
          set +e

          cd "$FOX_PATH"

          echo ""
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          if [ -d "out/target/product/mojito" ]; then

            ls -lah out/target/product/mojito

            echo ""
            echo "======================================"
            echo "RECOVERY FILES"
            echo "======================================"

            find out/target/product/mojito \
              -maxdepth 1 \
              -type f \
              \( \
                -name "*.img" \
                -o -name "*.zip" \
                -o -name "recovery*" \
              \) \
              -print

          else

            echo "Output directory does not exist."

          fi


      # =========================================================
      # 16. Upload recovery.img
      # =========================================================

      - name: Upload Recovery IMG
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-recovery
          path: |
            orangefox/out/target/product/mojito/recovery.img
            orangefox/out/target/product/mojito/vendor_boot.img
          if-no-files-found: warn


      # =========================================================
      # 17. Upload ZIP files if generated
      # =========================================================

      - name: Upload Recovery ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-zip
          path: |
            orangefox/out/target/product/mojito/*.zip
          if-no-files-found: warn
