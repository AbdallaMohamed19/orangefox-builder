name: Build OrangeFox 12.1 - mojito

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      FOX_PATH: ${{ github.workspace }}/fox_12.1

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Free disk space
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo docker system prune -af || true

          df -h


      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git lfs install

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"


      - name: Install repo
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"


      # ============================================================
      # CLONE THE COMPLETE ORANGEFOX SYNC REPOSITORY
      # ============================================================

      - name: Clone OrangeFox sync repository
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf OrangeFox_sync

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            OrangeFox_sync

          echo "============================================"
          echo "ORANGEFOX SYNC REPOSITORY"
          echo "============================================"

          cd OrangeFox_sync

          echo "Repository:"
          git remote -v

          echo ""
          echo "Files:"
          find . -maxdepth 2 -type f -print | sort | head -200

          echo ""
          echo "Checking sync script:"

          SYNC_SCRIPT=$(find . \
            -maxdepth 3 \
            -type f \
            -name 'orangefox_sync.sh' \
            -print -quit)

          if [ -z "$SYNC_SCRIPT" ]; then
            echo "ERROR: orangefox_sync.sh not found."
            exit 1
          fi

          echo "Found:"
          echo "$SYNC_SCRIPT"

          chmod +x "$SYNC_SCRIPT"

          echo "$GITHUB_WORKSPACE/OrangeFox_sync/$SYNC_SCRIPT" \
            > "$GITHUB_WORKSPACE/orangefox_sync_path.txt"

          echo ""
          echo "Checking patch directory:"

          if [ -d patches ]; then
            ls -lah patches
          else
            echo "ERROR: patches directory is missing."
            exit 1
          fi


      # ============================================================
      # SYNC ORANGEFOX 12.1
      # ============================================================

      - name: Sync OrangeFox 12.1
        run: |
          set -euxo pipefail

          SYNC_SCRIPT=$(cat "$GITHUB_WORKSPACE/orangefox_sync_path.txt")

          echo "Using sync script:"
          echo "$SYNC_SCRIPT"

          echo ""
          echo "Checking required patch:"

          PATCH_FILE="$GITHUB_WORKSPACE/OrangeFox_sync/patches/patch-manifest-fox_12.1.diff"

          if [ ! -f "$PATCH_FILE" ]; then
            echo "ERROR: Required patch is missing:"
            echo "$PATCH_FILE"

            echo ""
            echo "Available patches:"
            find "$GITHUB_WORKSPACE/OrangeFox_sync/patches" \
              -maxdepth 1 \
              -type f \
              -print | sort

            exit 1
          fi

          echo "Patch found:"
          ls -lh "$PATCH_FILE"

          rm -rf "$FOX_PATH"

          mkdir -p "$FOX_PATH"

          echo ""
          echo "============================================"
          echo "SYNCING ORANGEFOX 12.1"
          echo "============================================"

          cd "$(dirname "$SYNC_SCRIPT")"

          ./$(basename "$SYNC_SCRIPT") \
            --branch 12.1 \
            --path "$FOX_PATH"


      # ============================================================
      # VERIFY SOURCE
      # ============================================================

      - name: Verify OrangeFox source
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "VERIFY ORANGEFOX SOURCE"
          echo "============================================"

          test -d .repo
          test -f build/envsetup.sh

          echo "OrangeFox source is ready."

          echo ""
          echo "Source:"
          pwd

          echo ""
          echo "Disk usage:"
          du -sh . || true


      # ============================================================
      # DEVICE TREE
      # ============================================================

      - name: Clone mojito device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p device/xiaomi

          rm -rf device/xiaomi/mojito

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_mojito.git \
            device/xiaomi/mojito

          test -f device/xiaomi/mojito/BoardConfig.mk

          echo "Mojito device tree OK."


      # ============================================================
      # COMMON TREE
      # ============================================================

      - name: Clone SM6150 common tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p device/xiaomi

          rm -rf device/xiaomi/sm6150-common

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_sm6150-common.git \
            device/xiaomi/sm6150-common

          echo "SM6150 common tree OK."


      # ============================================================
      # KERNEL
      # ============================================================

      - name: Clone mojito kernel
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p kernel/xiaomi

          rm -rf kernel/xiaomi/mojito

          git clone \
            --depth=1 \
            https://github.com/nebrassy/android_kernel_xiaomi_mojito.git \
            kernel/xiaomi/mojito

          test -f kernel/xiaomi/mojito/Makefile

          echo "Mojito kernel OK."


      # ============================================================
      # ENVIRONMENT
      # ============================================================

      - name: Setup Android environment
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================"
          echo "LOADING ENVIRONMENT"
          echo "============================================"

          unset TOP
          unset OUT

          source build/envsetup.sh

          STATUS=$?

          echo ""
          echo "envsetup status: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            exit "$STATUS"
          fi


      # ============================================================
      # LUNCH
      # ============================================================

      - name: Lunch mojito
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          unset TOP
          unset OUT

          source build/envsetup.sh

          lunch twrp_mojito-eng

          echo ""
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-}"
          echo "TARGET_DEVICE=${TARGET_DEVICE:-}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-}"


      # ============================================================
      # BUILD
      # ============================================================

      - name: Build OrangeFox
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          unset TOP
          unset OUT

          source build/envsetup.sh

          lunch twrp_mojito-eng

          echo ""
          echo "============================================"
          echo "BUILDING RECOVERY"
          echo "============================================"

          mka recoveryimage


      # ============================================================
      # SHOW OUTPUT
      # ============================================================

      - name: Show build outputs
        if: always()
        shell: bash
        run: |
          set +e

          cd "$FOX_PATH"

          echo "============================================"
          echo "TARGET PRODUCT"
          echo "============================================"

          ls -lah out/target/product/mojito 2>/dev/null || true

          echo ""
          echo "============================================"
          echo "ALL IMG FILES"
          echo "============================================"

          find out \
            -type f \
            -name '*.img' \
            -print \
            2>/dev/null || true

          echo ""
          echo "============================================"
          echo "ALL ZIP FILES"
          echo "============================================"

          find out \
            -type f \
            -name '*.zip' \
            -print \
            2>/dev/null || true

          echo ""
          echo "============================================"
          echo "RECOVERY FILES"
          echo "============================================"

          find out \
            -type f \
            \( \
              -iname '*recovery*' \
              -o \
              -iname '*orangefox*' \
            \) \
            -print \
            2>/dev/null || true


      # ============================================================
      # ARTIFACTS
      # ============================================================

      - name: Upload OrangeFox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-build
          path: |
            fox_12.1/out/**/*.img
            fox_12.1/out/**/*.zip
          if-no-files-found: warn
          retention-days: 7
