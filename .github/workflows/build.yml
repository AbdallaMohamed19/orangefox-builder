name: Build OrangeFox Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo apt-get clean
          df -h

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync OrangeFox Source
        run: |
          git config --global user.name "AbdallaMohamed19"
          git config --global user.email "abdalla@example.com"
          
          mkdir -p ~/fox_12.1
          cd ~/fox_12.1
          
          repo init --depth=1 -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1
          repo sync -c --no-clone-bundle --no-tags --optimized-fetch --prune -j$(nproc) || repo sync -c -j4
          
          git clone https://gitlab.com/OrangeFox/device/mojito.git -b fox_12.1 device/xiaomi/mojito || git clone https://github.com/OrangeFox-Recovery-Devices/android_device_xiaomi_mojito_fox.git -b fox_12.1 device/xiaomi/mojito
          
          rm -f device/xiaomi/mojito/vendorsetup.sh

      - name: Build OrangeFox Recovery
        run: |
          cd ~/fox_12.1
          
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=mojito
          export LC_ALL="C"
          export FOX_VERSION="R11.1"
          export FOX_BUILD_TYPE="Unofficial"
          export FOX_MAINTAINER_PATCH_VERSION="0"
          export OF_MAINTAINER="Abdalla"
          export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
          
          source build/envsetup.sh
          lunch twrp_mojito-eng || lunch fox_mojito-eng
          
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox_Mojito_Recovery_Full
          path: |
            ~/fox_12.1/out/target/product/mojito/*.zip
            ~/fox_12.1/out/target/product/mojito/*.img
          if-no-files-found: warn
