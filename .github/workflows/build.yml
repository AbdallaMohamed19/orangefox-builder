name: OrangeFox Recovery - Mojito

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ---------------------------------------------------------
      # Checkout
      # ---------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Prepare build directories
      # ---------------------------------------------------------
      - name: Setup large partition permissions
        run: |
          set -e
          sudo mkdir -p /mnt/orangefox
          sudo chown -R "$USER:$USER" /mnt
          sudo chmod -R 777 /mnt

      # ---------------------------------------------------------
      # Install dependencies
      # ---------------------------------------------------------
      - name: Setup build environment
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            lib32ncurses5-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5-dev \
            libsdl1.2-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            xsltproc \
            zip \
            zlib1g-dev \
            python3 \
            python-is-python3

          git --version
          python3 --version
          curl --version

      # ---------------------------------------------------------
      # Install repo
      # ---------------------------------------------------------
      - name: Install repo
        run: |
          set -e

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod a+x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

          export PATH="$HOME/bin:$PATH"

          repo --version

      # ---------------------------------------------------------
      # Sync OrangeFox 12.1
      # ---------------------------------------------------------
      - name: Sync OrangeFox source
        run: |
          set -eo pipefail

          git config --global user.name "AbdallaMohamed19"
          git config --global user.email "abdalla@example.com"

          cd /mnt

          rm -rf /mnt/orangefox
          rm -rf /mnt/sync

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git \
            /mnt/sync

          cd /mnt/sync

          chmod +x orangefox_sync.sh

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path /mnt/orangefox

      # ---------------------------------------------------------
      # Add official OrangeFox Mojito device tree
      # ---------------------------------------------------------
      - name: Add Mojito device tree
        run: |
          set -eo pipefail

          cd /mnt/orangefox

          echo "===== Removing old Mojito tree ====="
          rm -rf device/xiaomi/mojito

          echo "===== Cloning official OrangeFox Mojito tree ====="

          git clone \
            --depth=1 \
            --branch fox_12.1 \
            https://gitlab.com/OrangeFox/device/mojito.git \
            device/xiaomi/mojito

          echo "===== Device tree status ====="

          git -C device/xiaomi/mojito status
          git -C device/xiaomi/mojito log -1 --oneline

          echo "===== Checking required files ====="

          test -f device/xiaomi/mojito/AndroidProducts.mk
          test -f device/xiaomi/mojito/vendorsetup.sh
          test -f device/xiaomi/mojito/twrp_mojito.mk
          test -f device/xiaomi/mojito/twrp.dependencies

          echo "===== vendorsetup.sh ====="
          sed -n '1,240p' device/xiaomi/mojito/vendorsetup.sh

          echo "===== AndroidProducts.mk ====="
          cat device/xiaomi/mojito/AndroidProducts.mk

      # ---------------------------------------------------------
      # Sync device dependencies
      # ---------------------------------------------------------
      - name: Sync Mojito device dependencies
        run: |
          set -eo pipefail

          cd /mnt/orangefox

          echo "===== Device dependencies ====="
          cat device/xiaomi/mojito/twrp.dependencies

          mkdir -p device/qcom

          rm -rf device/qcom/twrp-common

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_qcom_twrp-common.git \
            device/qcom/twrp-common

          test -d device/qcom/twrp-common

          echo "===== qcom twrp-common ====="
          git -C device/qcom/twrp-common log -1 --oneline

      # ---------------------------------------------------------
      # Prepare OrangeFox environment
      # ---------------------------------------------------------
      - name: Prepare OrangeFox build environment
        run: |
          set -eo pipefail

          cd /mnt/orangefox

          export FOX_BUILD_DEVICE=mojito
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_TYPE=Unofficial
          export FOX_MAINTAINER_PATCH_VERSION=0

          # مهم:
          # لا تستخدم set -u هنا لأن envsetup.sh و vendorsetup.sh
          # يستخدمان متغيرات قد لا تكون معرفة أثناء الـ source.

          set +u

          source build/envsetup.sh

          set -u

          # -----------------------------------------------------
          # إعادة تعيين المتغيرات بعد envsetup
          # لأن vendorsetup.sh الرسمي قد يغير بعضها.
          # -----------------------------------------------------

          export FOX_BUILD_DEVICE=mojito
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_TYPE=Unofficial
          export FOX_MAINTAINER_PATCH_VERSION=0
          export OF_MAINTAINER="Abdalla"

          # استخدم إصدار OrangeFox الخاص بالفرع 12.1.
          # لا نسمح لـ vendorsetup.sh القديم بتغيير إعداداتنا.
          export FOX_VERSION="R11.2"

          echo "========================================"
          echo "OrangeFox build variables"
          echo "========================================"

          env | grep -E '^(FOX_|OF_|TW_|TARGET_)' | sort || true

          echo "========================================"
          echo "Lunch target"
          echo "========================================"

          lunch twrp_mojito-eng

          echo "========================================"
          echo "Lunch completed"
          echo "========================================"

          get_build_var TARGET_DEVICE
          get_build_var PRODUCT_DEVICE
          get_build_var TARGET_ARCH

      # ---------------------------------------------------------
      # Build OrangeFox
      # ---------------------------------------------------------
      - name: Build OrangeFox Recovery
        run: |
          set -eo pipefail

          cd /mnt/orangefox

          export FOX_BUILD_DEVICE=mojito
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_TYPE=Unofficial
          export FOX_MAINTAINER_PATCH_VERSION=0
          export OF_MAINTAINER="Abdalla"
          export FOX_VERSION="R11.2"

          echo "========================================"
          echo "Loading OrangeFox environment"
          echo "========================================"

          set +u
          source build/envsetup.sh
          set -u

          # إعادة المتغيرات بعد source
          export FOX_BUILD_DEVICE=mojito
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C
          export FOX_BUILD_TYPE=Unofficial
          export FOX_MAINTAINER_PATCH_VERSION=0
          export OF_MAINTAINER="Abdalla"
          export FOX_VERSION="R11.2"

          echo "========================================"
          echo "Lunch"
          echo "========================================"

          lunch twrp_mojito-eng

          echo "========================================"
          echo "Build variables"
          echo "========================================"

          env | grep -E '^(FOX_|OF_|TW_|TARGET_)' | sort || true

          echo "========================================"
          echo "Starting OrangeFox build"
          echo "========================================"

          mka recoveryimage -j"$(nproc)"

          echo "========================================"
          echo "Build finished"
          echo "========================================"

      # ---------------------------------------------------------
      # Show build output
      # ---------------------------------------------------------
      - name: Show Build Output
        if: always()
        run: |
          echo "========================================"
          echo "OrangeFox output directory"
          echo "========================================"

          OUT="/mnt/orangefox/out/target/product/mojito"

          if [ -d "$OUT" ]; then
            ls -lah "$OUT"
          else
            echo "Output directory does not exist."
          fi

          echo "========================================"
          echo "Recovery files"
          echo "========================================"

          find "$OUT" \
            -maxdepth 1 \
            -type f \
            \( \
              -name "*.img" \
              -o -name "*.zip" \
            \) \
            -print 2>/dev/null || true

      # ---------------------------------------------------------
      # Upload recovery
      # ---------------------------------------------------------
      - name: Upload Recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox_Mojito_Recovery
          path: |
            /mnt/orangefox/out/target/product/mojito/*.zip
            /mnt/orangefox/out/target/product/mojito/*.img
          if-no-files-found: warn
