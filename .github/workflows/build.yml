name: Build OrangeFox 12.1 - mojito

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      FOX_PATH: ${{ github.workspace }}/fox_12.1
      ALLOW_MISSING_DEPENDENCIES: "true"
      LC_ALL: C

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Free disk space
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo docker system prune -af || true

          df -h


      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git lfs install

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"


      - name: Install repo
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"


      # ============================================================
      # CHECK AVAILABLE ORANGEFOX MANIFEST
      # ============================================================

      - name: Check OrangeFox manifest
        run: |
          set -euxo pipefail

          echo "============================================"
          echo "ORANGEFOX MANIFEST"
          echo "============================================"

          git ls-remote \
            --heads \
            https://gitlab.com/OrangeFox/Manifest.git

          echo ""
          echo "============================================"
          echo "ORANGEFOX RECOVERY 12.1"
          echo "============================================"

          git ls-remote \
            --heads \
            https://gitlab.com/OrangeFox/bootable/Recovery.git \
            fox_12.1

          echo ""
          echo "============================================"
          echo "ORANGEFOX VENDOR 12.1"
          echo "============================================"

          git ls-remote \
            --heads \
            https://gitlab.com/OrangeFox/vendor/recovery.git \
            fox_12.1


      # ============================================================
      # INITIALIZE AOSP/TWRP MANIFEST
      # ============================================================

      - name: Initialize Android source
        run: |
          set -euxo pipefail

          rm -rf "$FOX_PATH"

          mkdir -p "$FOX_PATH"

          cd "$FOX_PATH"

          echo "============================================"
          echo "INITIALIZING MANIFEST"
          echo "============================================"

          repo init \
            -u https://gitlab.com/OrangeFox/Manifest.git \
            -b fox_12.1 \
            --depth=1

          echo ""
          echo "Manifest initialized."

          ls -lah .repo/manifests


      # ============================================================
      # SYNC SOURCE
      # ============================================================

      - name: Sync Android source
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "SYNCING SOURCE"
          echo "============================================"

          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -j2

          echo ""
          echo "============================================"
          echo "SYNC COMPLETE"
          echo "============================================"

          test -f build/envsetup.sh


      # ============================================================
      # ORANGEFOX RECOVERY
      # ============================================================

      - name: Verify OrangeFox recovery
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "RECOVERY"
          echo "============================================"

          if [ -d bootable/recovery ]; then
            echo "bootable/recovery exists"
          else
            echo "ERROR: bootable/recovery missing"
            exit 1
          fi

          git -C bootable/recovery branch -a || true

          echo ""
          echo "OrangeFox files:"

          ls -la bootable/recovery | head -100


      # ============================================================
      # ORANGEFOX VENDOR
      # ============================================================

      - name: Verify OrangeFox vendor
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "VENDOR"
          echo "============================================"

          if [ -d vendor/recovery ]; then
            echo "vendor/recovery exists"
          else
            echo "ERROR: vendor/recovery missing"
            exit 1
          fi

          ls -la vendor/recovery | head -100


      # ============================================================
      # MOJITO DEVICE TREE
      # ============================================================

      - name: Clone mojito device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p device/xiaomi

          rm -rf device/xiaomi/mojito

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_mojito.git \
            device/xiaomi/mojito

          test -f device/xiaomi/mojito/BoardConfig.mk

          echo "Mojito device tree OK."


      # ============================================================
      # COMMON TREE
      # ============================================================

      - name: Clone SM6150 common tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p device/xiaomi

          rm -rf device/xiaomi/sm6150-common

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_sm6150-common.git \
            device/xiaomi/sm6150-common

          echo "SM6150 common tree OK."


      # ============================================================
      # KERNEL
      # ============================================================

      - name: Clone mojito kernel
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p kernel/xiaomi

          rm -rf kernel/xiaomi/mojito

          git clone \
            --depth=1 \
            https://github.com/nebrassy/android_kernel_xiaomi_mojito.git \
            kernel/xiaomi/mojito

          test -f kernel/xiaomi/mojito/Makefile

          echo "Kernel OK."


      # ============================================================
      # CHECK DEVICE
      # ============================================================

      - name: Check device configuration
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "DEVICE CONFIGURATION"
          echo "============================================"

          test -f device/xiaomi/mojito/BoardConfig.mk
          test -f device/xiaomi/mojito/AndroidProducts.mk
          test -f device/xiaomi/mojito/device.mk

          echo ""
          echo "AndroidProducts.mk:"
          cat device/xiaomi/mojito/AndroidProducts.mk

          echo ""
          echo "BoardConfig:"
          grep -E \
            'TARGET_BOARD_PLATFORM|TARGET_BOOTLOADER_BOARD_NAME|BOARD_BOOT_HEADER_VERSION|AB_OTA|VIRTUAL_AB' \
            device/xiaomi/mojito/BoardConfig.mk \
            || true


      # ============================================================
      # ENVIRONMENT
      # ============================================================

      - name: Setup build environment
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================
