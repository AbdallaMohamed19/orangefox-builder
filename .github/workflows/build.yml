name: Build OrangeFox Mojito

on:
  workflow_dispatch:

env:
  DEVICE_TREE: https://github.com/USERNAME/REPO.git
  DEVICE_BRANCH: fox_12.1
  DEVICE_PATH: device/xiaomi/mojito
  FOX_BRANCH: "12.1"
  TARGET: twrp_mojito-eng

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          swap-storage: true

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y git aria2 curl python3 python-is-python3 bc bison \
            build-essential ccache flex g++-multilib gcc-multilib libncurses5 \
            libssl-dev libxml2-utils lz4 zip unzip zlib1g-dev rsync xsltproc \
            openjdk-11-jdk repo

      - name: Git config
        run: |
          git config --global user.name "builder"
          git config --global user.email "builder@example.com"

      - name: Sync OrangeFox sources
        run: |
          mkdir -p ~/fox
          git clone https://gitlab.com/OrangeFox/sync.git ~/sync
          cd ~/sync
          ./orangefox_sync.sh --branch $FOX_BRANCH --path ~/fox

      - name: Clone device tree
        run: |
          git clone $DEVICE_TREE -b $DEVICE_BRANCH ~/fox/$DEVICE_PATH

      - name: Build
        run: |
          cd ~/fox
          set +e
          source build/envsetup.sh
          set -e
          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL="C"
          export FOX_BUILD_DEVICE=mojito
          lunch $TARGET
          mka adbd recoveryimage -j$(nproc --all)

      - name: Upload recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito
          path: |
            ~/fox/out/target/product/mojito/OrangeFox*.zip
            ~/fox/out/target/product/mojito/recovery.img
