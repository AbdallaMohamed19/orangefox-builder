name: Build OrangeFox - Sunny / Mojito

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Select device"
        required: true
        type: choice
        options:
          - sunny
          - mojito
        default: sunny
      usb_automount:
        description: "Experimental: show USB OTG flash drive in the storage list + auto-mount it in recovery"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      FOX_BRANCH: fox_12.1
      FOX_BUILD_TYPE: Unofficial
      FOX_MAINTAINER_PATCH_VERSION: "0"
      MAINTAINER_NAME: Abdalla
      LC_ALL: C
      ALLOW_MISSING_DEPENDENCIES: "true"
      USE_CCACHE: "0"
      GIT_TERMINAL_PROMPT: "0"
      DEBIAN_FRONTEND: noninteractive

    steps:
      # ------------------------------------------------------------
      - name: Set device variables
        shell: bash
        run: |
          set -e

          DEVICE="${{ inputs.device }}"

          case "$DEVICE" in
            sunny|mojito) ;;
            *) echo "Unsupported device: $DEVICE"; exit 1 ;;
          esac

          {
            echo "DEVICE=$DEVICE"
            echo "DEVICE_TREE=$DEVICE"
            echo "FOX_BUILD_DEVICE=$DEVICE"
          } >> "$GITHUB_ENV"

          echo "Device: $DEVICE"

      # ------------------------------------------------------------
      - name: Free disk space
        run: |
          set +e

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean

          df -h
          exit 0

      # ------------------------------------------------------------
      - name: Add swap (avoid out-of-memory)
        run: |
          set +e
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          if sudo fallocate -l 10G /mnt/swapfile; then
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          else
            echo "Could not create swap, continuing without it."
          fi
          free -h
          exit 0

      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            curl \
            fontconfig \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            lib32ncurses-dev \
            lib32z1-dev \
            libc6-dev-i386 \
            libgl1-mesa-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libx11-dev \
            libxml2 \
            libxml2-utils \
            lz4 \
            lzop \
            pngcrush \
            python3 \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            x11proto-core-dev \
            xsltproc \
            xz-utils \
            zip \
            zlib1g-dev

      # ------------------------------------------------------------
      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      # ------------------------------------------------------------
      - name: Install repo
        shell: bash
        run: |
          set -eux

          mkdir -p "${HOME}/bin"

          curl -L --retry 5 --retry-delay 5 \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          "${HOME}/bin/repo" version

      # ------------------------------------------------------------
      - name: Sync OrangeFox source (with retries)
        shell: bash
        run: |
          set -eu

          cd "${HOME}"
          rm -rf OrangeFox_sync fox_12.1

          for i in 1 2 3; do
            git clone --depth=1 https://gitlab.com/OrangeFox/sync.git OrangeFox_sync && break
            echo "Clone attempt $i failed, retrying..."
            rm -rf OrangeFox_sync
            sleep 10
          done

          [ -d OrangeFox_sync ] || { echo "ERROR: could not clone sync repo"; exit 1; }

          SYNC_SCRIPT="$(find "${HOME}/OrangeFox_sync" -name orangefox_sync.sh | head -n1)"

          if [ -z "${SYNC_SCRIPT}" ]; then
            echo "ERROR: orangefox_sync.sh not found. Repo contents:"
            ls -laR "${HOME}/OrangeFox_sync" | head -n 50
            exit 1
          fi

          echo "Using sync script: ${SYNC_SCRIPT}"
          chmod +x "${SYNC_SCRIPT}"
          cd "$(dirname "${SYNC_SCRIPT}")"

          OK=0
          for i in 1 2 3; do
            echo "=== Sync attempt $i ==="
            if ./orangefox_sync.sh --branch 12.1 --path "${HOME}/fox_12.1"; then
              OK=1
              break
            fi
            echo "Sync attempt $i failed, retrying in 30s..."
            sleep 30
          done

          [ "$OK" = "1" ] || { echo "ERROR: sync failed after 3 attempts"; exit 1; }

          [ -f "${HOME}/fox_12.1/build/envsetup.sh" ] || { echo "ERROR: build/envsetup.sh missing after sync"; exit 1; }

          df -h

      # ------------------------------------------------------------
      - name: Sync device tree
        shell: bash
        run: |
          set -eu

          cd "${HOME}/fox_12.1"

          mkdir -p device/xiaomi
          rm -rf "device/xiaomi/${DEVICE_TREE}"

          echo "Cloning OrangeFox device tree: ${DEVICE_TREE}"

          if ! git clone --depth=1 -b "${FOX_BRANCH}" \
              "https://gitlab.com/OrangeFox/device/${DEVICE_TREE}.git" \
              "device/xiaomi/${DEVICE_TREE}"; then

            echo "GitLab tree not available, trying GitHub fallback..."
            rm -rf "device/xiaomi/${DEVICE_TREE}"

            git clone --depth=1 -b "${FOX_BRANCH}" \
              "https://github.com/OrangeFox-Recovery-Devices/android_device_xiaomi_${DEVICE_TREE}_fox.git" \
              "device/xiaomi/${DEVICE_TREE}" || {
                echo "ERROR: could not clone a device tree for ${DEVICE_TREE}."
                echo "Check the repo name / branch (${FOX_BRANCH})."
                exit 1
              }
          fi

          ls -la "device/xiaomi/${DEVICE_TREE}"

      # ------------------------------------------------------------
      - name: Validate device tree
        shell: bash
        run: |
          set -e

          DEVICE_PATH="${HOME}/fox_12.1/device/xiaomi/${DEVICE_TREE}"

          for f in BoardConfig.mk AndroidProducts.mk; do
            if [ ! -f "${DEVICE_PATH}/${f}" ]; then
              echo "ERROR: ${f} not found in ${DEVICE_PATH}"
              exit 1
            fi
          done

          echo "Device tree validation passed."

      # ------------------------------------------------------------
      - name: Fix obsolete variables in device tree
        shell: bash
        run: |
          set +e
          cd "${HOME}/fox_12.1"
          TREE="device/xiaomi/${DEVICE_TREE}"
          MK="bootable/recovery/orangefox.mk"

          echo "----- Obsolete-variable checks found in orangefox.mk -----"
          grep -n "obsolete" "${MK}"

          # Build an "OLD NEW" rename map automatically from orangefox.mk messages
          grep -hoE '"[A-Za-z0-9_]+" is obsolete\. Use "(export )?[A-Za-z0-9_]+' "${MK}" \
            | sed -E 's/^"([A-Za-z0-9_]+)" is obsolete\. Use "(export )?([A-Za-z0-9_]+)$/\1 \3/' \
            > /tmp/obsolete_map.txt

          # Fallback for the known ones
          {
            echo "OF_AB_DEVICE FOX_AB_DEVICE"
            echo "OF_VIRTUAL_AB_DEVICE FOX_VIRTUAL_AB_DEVICE"
          } >> /tmp/obsolete_map.txt

          sort -u /tmp/obsolete_map.txt -o /tmp/obsolete_map.txt

          echo "----- Rename map -----"
          cat /tmp/obsolete_map.txt

          while read -r OLD NEW; do
            [ -z "${OLD}" ] && continue
            [ -z "${NEW}" ] && continue
            [ "${OLD}" = "${NEW}" ] && continue
            FILES="$(grep -rlw --exclude-dir=.git -- "${OLD}" "${TREE}")"
            if [ -n "${FILES}" ]; then
              echo "Renaming ${OLD} -> ${NEW} in:"
              echo "${FILES}"
              echo "${FILES}" | xargs -r sed -i "s/\b${OLD}\b/${NEW}/g"
            fi
          done < /tmp/obsolete_map.txt

          echo "----- OF_MAINTAINER / About-page flags in tree (before) -----"
          grep -rn --exclude-dir=.git -E "OF_MAINTAINER|OF_DISABLE_EXTRA_ABOUT_PAGE" "${TREE}"

          # Force our maintainer name inside the tree (it may set its own)
          grep -rl --exclude-dir=.git "OF_MAINTAINER" "${TREE}" | while read -r f; do
            case "$f" in
              *.mk)
                sed -i -E "s|^([[:space:]]*OF_MAINTAINER[[:space:]]*:?=).*|\1 ${MAINTAINER_NAME}|" "$f" ;;
              *)
                sed -i -E "s|^([[:space:]]*(export[[:space:]]+)?OF_MAINTAINER=).*|\1\"${MAINTAINER_NAME}\"|" "$f" ;;
            esac
          done

          echo "----- OF_MAINTAINER in tree (after) -----"
          grep -rn --exclude-dir=.git "OF_MAINTAINER" "${TREE}"

          echo "----- USB OTG related lines in tree (diagnostic) -----"
          grep -rniE "otg" --exclude-dir=.git "${TREE}" | head -n 40

          exit 0

      # ------------------------------------------------------------
      - name: Add USB OTG storage entry + auto-mount helper
        if: ${{ inputs.usb_automount }}
        shell: bash
        run: |
          set +e
          cd "${HOME}/fox_12.1"
          TREE="device/xiaomi/${DEVICE_TREE}"

          # Stable path the helper keeps pointing at the plugged-in flash drive.
          # The fstab entry uses it, so the drive shows up in the "Select Storage"
          # list no matter what the real node is called (sda1, sdg1, ...).
          LINK="/dev/block/usb_otg_part"

          # 1) Add / fix the USB OTG storage entry in the tree's recovery fstab
          cat > /tmp/patch_usb_fstab.py <<'PY_EOF'
          import os
          import re
          import sys

          tree, link, default_mnt = sys.argv[1:4]

          # TWRP fstab line: <mount> <fstype> <device> [<device2>] [flags=...]
          LINE = re.compile(r'^(/\S*)\s+(\S+)\s+(/\S+)(?:\s+(/\S+))?(?:\s+(.*))?$')
          NEW_FLAGS = 'flags=display="USB OTG";storage;removable'


          def log(msg):
              print(msg, file=sys.stderr)


          def is_usb(mount):
              return re.search(r'usb|otg', mount, re.I) is not None


          def has_flag(rest, name):
              return re.search(r'(?:flags=|;)' + name + r'(?:;|\s|$)', rest) is not None


          def read(path):
              with open(path, encoding='utf-8', errors='replace', newline='') as f:
                  return f.read()


          # fstab-like files that use the TWRP format (they have "flags=" lines)
          cands = []
          for root, dirs, names in os.walk(tree):
              dirs[:] = [d for d in dirs if d != '.git']
              for n in names:
                  low = n.lower()
                  path = os.path.join(root, n)
                  if not ('fstab' in low or low.endswith('.flags')):
                      continue
                  if os.path.getsize(path) > 1000000:
                      continue
                  for ln in read(path).splitlines():
                      m = LINE.match(ln.strip())
                      if m and 'flags=' in (m.group(5) or ''):
                          cands.append(path)
                          break
          cands.sort(key=lambda p: (len(p), p))

          if not cands:
              log('No TWRP-format fstab / twrp.flags found in ' + tree)
              sys.exit(0)

          # reuse the mount point the tree already uses for USB, if any
          mnt = default_mnt
          found = False
          for path in cands:
              for ln in read(path).splitlines():
                  s = ln.strip()
                  m = None if s.startswith('#') else LINE.match(s)
                  if m and is_usb(m.group(1)):
                      mnt = m.group(1)
                      found = True
                      break
              if found:
                  break

          for path in cands:
              text = read(path)
              lines = text.split('\n')
              done = False
              for i, ln in enumerate(lines):
                  s = ln.strip()
                  m = None if s.startswith('#') else LINE.match(s)
                  if not (m and is_usb(m.group(1))):
                      continue
                  mount, fstype, dev1, dev2, rest = m.groups()
                  rest = rest or ''
                  # new primary device = our symlink, the old one stays as fallback
                  old = dev2 if dev1 == link else dev1
                  if 'flags=' not in rest:
                      rest = (rest + ' ' + NEW_FLAGS).strip()
                  for flag in ('storage', 'removable'):
                      if not has_flag(rest, flag):
                          rest = rest.rstrip().rstrip(';') + ';' + flag
                  cols = [mount, fstype, link] + ([old] if old else []) + [rest]
                  lines[i] = ' '.join(cols) + ('\r' if ln.endswith('\r') else '')
                  log('%s: updated  -> %s' % (path, lines[i].strip()))
                  done = True
                  break
              if not done:
                  entry = '%s auto %s %s' % (mnt, link, NEW_FLAGS)
                  if text and not text.endswith('\n'):
                      text += '\n'
                  text += '\n# USB OTG storage entry (added by CI)\n' + entry + '\n'
                  lines = text.split('\n')
                  log('%s: appended -> %s' % (path, entry))
              with open(path, 'w', encoding='utf-8', newline='') as f:
                  f.write('\n'.join(lines))

          print(mnt)
          PY_EOF

          MNT="$(python3 /tmp/patch_usb_fstab.py "${TREE}" "${LINK}" /usb_otg)"
          if [ -z "${MNT}" ]; then
            echo "Could not add a USB OTG entry (no TWRP-format fstab found). Skipping helper."
            echo "fstab-like files in the tree:"
            find "${TREE}" -type f \( -iname '*fstab*' -o -iname '*.flags' \) -not -path '*/.git/*'
            exit 0
          fi
          echo "USB OTG mount point: ${MNT}"

          # 2) Helper script that goes into the recovery ramdisk
          mkdir -p "${TREE}/recovery/root/system/bin"
          SCRIPT="${TREE}/recovery/root/system/bin/usb_automount.sh"

          cat > "${SCRIPT}" <<'HELPER_EOF'
          #!/system/bin/sh
          # USB OTG auto-mount helper (added by CI)
          #  - keeps $LINK pointing at the plugged-in USB partition, so the recovery
          #    storage list (fstab entry for $MNT) can see the drive
          #  - mounts the drive on $MNT as soon as it is detected
          # Log: /tmp/usb_automount.log (also copied into /tmp/recovery.log)
          MNT="@MNT@"
          LINK="@LINK@"
          LOG=/tmp/usb_automount.log

          log() {
            echo "usb_automount: $*" >> "$LOG"
            echo "usb_automount: $*" >> /tmp/recovery.log
          }

          # names of the partitions (or the bare disk when there is no partition
          # table) of every disk that really sits on the USB bus
          list_usb() {
            for d in /sys/block/sd*; do
              [ -e "$d" ] || continue
              n="${d##*/}"
              case "$(readlink -f "$d" 2>/dev/null)" in
                *usb*) ;;
                *) continue ;;
              esac
              P=""
              for p in "$d"/"$n"*; do
                [ -e "$p/partition" ] && P="$P ${p##*/}"
              done
              if [ -n "$P" ]; then
                echo $P
              else
                SZ="$(cat "$d/size" 2>/dev/null)"
                [ "${SZ:-0}" -gt 0 ] 2>/dev/null && echo "$n"
              fi
            done
          }

          # make sure /dev/block/<name> exists (ueventd normally creates it)
          ensure_node() {
            [ -e "/dev/block/$1" ] && return 0
            NUM="$(cat "/sys/class/block/$1/dev" 2>/dev/null)"
            [ -n "$NUM" ] || return 1
            mknod "/dev/block/$1" b "${NUM%%:*}" "${NUM##*:}" 2>/dev/null
            [ -e "/dev/block/$1" ]
          }

          # unmount $MNT when it still points at a drive that was unplugged
          drop_stale() {
            SRC=""
            while read -r a b c; do
              [ "$b" = "$MNT" ] && SRC="$a"
            done < /proc/mounts
            case "$SRC" in
              /dev/block/*)
                if [ ! -e "/sys/class/block/${SRC##*/}" ]; then
                  umount -l "$MNT" 2>/dev/null
                  log "unmounted stale $MNT ($SRC)"
                fi
                ;;
            esac
          }

          try_mount() {
            mkdir -p "$MNT"
            drop_stale
            FIRST=""
            for n in "$@"; do
              ensure_node "$n" || continue
              dev="/dev/block/$n"
              if [ -z "$FIRST" ]; then
                FIRST="$n"
                ln -sf "$dev" "$LINK"
              fi
              if grep -q " $MNT " /proc/mounts; then
                log "$MNT already mounted"
                return 0
              fi
              mount "$dev" "$MNT" 2>/dev/null ||
              mount -t vfat -o rw "$dev" "$MNT" 2>/dev/null ||
              mount -t exfat "$dev" "$MNT" 2>/dev/null ||
              mount -t ntfs "$dev" "$MNT" 2>/dev/null ||
              mount -t ext4 "$dev" "$MNT" 2>/dev/null
              if grep -q " $MNT " /proc/mounts; then
                log "mounted $dev on $MNT"
                ln -sf "$dev" "$LINK"
                return 0
              fi
              log "could not mount $dev"
            done
            return 1
          }

          log "started (mount point $MNT, link $LINK)"
          LAST=""
          DONE=0
          TRIES=0

          while true; do
            CAND="$(echo $(list_usb))"
            if [ "$CAND" != "$LAST" ]; then
              # plugged in, pulled out or swapped
              if [ -n "$LAST" ]; then
                log "USB storage removed or changed ($LAST)"
                rm -f "$LINK"
                drop_stale
              fi
              DONE=0
              TRIES=0
              if [ -n "$CAND" ]; then
                sleep 2   # let the partition table settle
                CAND="$(echo $(list_usb))"
                log "USB storage detected: $CAND"
              fi
              LAST="$CAND"
            fi

            if [ -n "$CAND" ] && [ "$DONE" = "0" ]; then
              if try_mount $CAND; then
                DONE=1
              else
                TRIES=$((TRIES + 1))
                [ "$TRIES" -ge 5 ] && DONE=1
              fi
            fi
            sleep 3
          done
          HELPER_EOF

          sed -i "s|@MNT@|${MNT}|g; s|@LINK@|${LINK}|g" "${SCRIPT}"
          chmod 755 "${SCRIPT}"

          # 3) Register it as a service in the tree's recovery init rc
          RC="$(find "${TREE}" -type f -name 'init.recovery*.rc' \
            | awk '{print length($0), $0}' | sort -n | head -n1 | cut -d' ' -f2-)"

          if [ -z "${RC}" ]; then
            RC="${TREE}/recovery/root/init.recovery.qcom.rc"
            echo "No init.recovery*.rc found, creating ${RC}"
          fi
          echo "Appending service to: ${RC}"

          cat >> "${RC}" <<'RC_EOF'

          service usbautomount /system/bin/sh /system/bin/usb_automount.sh
              user root
              group root
              disabled
              seclabel u:r:recovery:s0

          on boot
              start usbautomount
          RC_EOF

          echo "----- USB lines in the tree's fstab files -----"
          grep -rniE --include='*fstab*' --include='*.flags' 'usb|otg' "${TREE}"
          echo "----- end of ${RC} -----"
          tail -n 12 "${RC}"

          exit 0

      # ------------------------------------------------------------
      - name: Build OrangeFox
        shell: bash
        timeout-minutes: 300
        run: |
          # NOTE: no "set -u": Android's envsetup.sh uses unset variables
          set -eo pipefail

          cd "${HOME}/fox_12.1"

          export FOX_BUILD_DEVICE="${DEVICE}"
          DEVICE_PATH="device/xiaomi/${DEVICE_TREE}"

          # ccache is disabled: Android 12 build sandbox makes ~/.ccache read-only
          unset USE_CCACHE CCACHE_EXEC CCACHE_DIR

          set +e
          source build/envsetup.sh
          if [ -f "${DEVICE_PATH}/vendorsetup.sh" ]; then
            source "${DEVICE_PATH}/vendorsetup.sh"
          fi
          set -e

          # FOX_VERSION is obsolete in recent OrangeFox and breaks the build
          unset FOX_VERSION

          # Force our maintainer name (a device tree may set its own)
          export OF_MAINTAINER="${MAINTAINER_NAME}"
          echo "OF_MAINTAINER=${OF_MAINTAINER}"

          LUNCH_OK=""
          for prefix in twrp omni fox; do
            TARGET="${prefix}_${DEVICE}-eng"
            echo "Trying lunch ${TARGET}"
            if lunch "${TARGET}"; then
              LUNCH_OK="${TARGET}"
              break
            fi
          done

          [ -n "${LUNCH_OK}" ] || { echo "ERROR: no valid lunch target for ${DEVICE}"; exit 1; }

          echo "TARGET_PRODUCT = $(get_build_var TARGET_PRODUCT)"
          echo "TARGET_DEVICE  = $(get_build_var TARGET_DEVICE)"

          # A-only device -> recoveryimage, A/B device -> bootimage
          if grep -rEqs "^\s*(export\s+)?(FOX_AB_DEVICE|FOX_VIRTUAL_AB_DEVICE|AB_OTA_UPDATER)\s*:?=\s*(1|true)" "${DEVICE_PATH}"; then
            MAKE_TARGET="bootimage"
          else
            MAKE_TARGET="recoveryimage"
          fi
          echo "Building target: adbd ${MAKE_TARGET}"

          df -h
          free -h

          mka adbd "${MAKE_TARGET}" -j"$(nproc)" 2>&1 | tee "${HOME}/build.log"

      # ------------------------------------------------------------
      - name: Show build output
        if: always()
        shell: bash
        run: |
          set +e
          PRODUCT_OUT="${HOME}/fox_12.1/out/target/product/${DEVICE}"

          if [ -d "${PRODUCT_OUT}" ]; then
            ls -lah "${PRODUCT_OUT}"
            echo "Images:"
            find "${PRODUCT_OUT}" -maxdepth 1 -type f -name "*.img" -print
            echo "ZIPs:"
            find "${PRODUCT_OUT}" -maxdepth 1 -type f -name "*.zip" -print
          else
            echo "Product output directory does not exist."
          fi

          if [ "${{ inputs.usb_automount }}" = "true" ]; then
            ROOT="${PRODUCT_OUT}/recovery/root"
            echo "----- USB OTG check inside the recovery ramdisk -----"
            ls -l "${ROOT}/system/bin/usb_automount.sh"
            grep -rniE --include='*fstab*' --include='*.flags' 'usb|otg' "${ROOT}" | head -n 10
            grep -rn --include='*.rc' 'usbautomount' "${ROOT}" | head -n 5
          fi
          exit 0

      # ------------------------------------------------------------
      - name: Upload OrangeFox
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ inputs.device }}-fox12.1${{ inputs.usb_automount && '-usbmount' || '' }}
          if-no-files-found: error
          compression-level: 9
          path: |
            /home/runner/fox_12.1/out/target/product/${{ inputs.device }}/recovery.img
            /home/runner/fox_12.1/out/target/product/${{ inputs.device }}/boot.img
            /home/runner/fox_12.1/out/target/product/${{ inputs.device }}/OrangeFox*.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.device }}${{ inputs.usb_automount && '-usbmount' || '' }}
          if-no-files-found: ignore
          path: /home/runner/build.log
