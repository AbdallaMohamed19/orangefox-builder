name: Build OrangeFox Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Large Partition Permissions
        run: |
          sudo mkdir -p /mnt/orangefox
          sudo chown -R $USER:$USER /mnt
          sudo chmod -R 777 /mnt

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3

      - name: Install Repo
        run: |
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Sync OrangeFox Source via Official Script
        run: |
          set -e
          git config --global user.name "AbdallaMohamed19"
          git config --global user.email "abdalla@example.com"
          
          cd /mnt
          git clone https://gitlab.com/OrangeFox/sync.git
          cd sync
          ./orangefox_sync.sh --branch 12.1 --path /mnt/orangefox
          
          cd /mnt/orangefox
          git clone https://gitlab.com/OrangeFox/device/mojito.git -b fox_12.1 device/xiaomi/mojito || git clone https://github.com/OrangeFox-Recovery-Devices/android_device_xiaomi_mojito_fox.git -b fox_12.1 device/xiaomi/mojito

      - name: Build OrangeFox
        run: |
          set -e
          cd /mnt/orangefox
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=mojito
          export LC_ALL="C"
          
          # إزالة أو تعطيل vendorsetup.sh لمنع توقف البيئة
          rm -f device/xiaomi/mojito/vendorsetup.sh
          
          source build/envsetup.sh
          lunch twrp_mojito-eng || lunch omni_mojito-eng || lunch twrp_mojito-userdebug
          mka recoveryimage -j$(nproc)

      - name: Upload Recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox_Mojito_Recovery
          path: |
            /mnt/orangefox/out/target/product/mojito/*.img
            /mnt/orangefox/out/target/product/mojito/*.zip
