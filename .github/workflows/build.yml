name: Build OrangeFox - Sunny / Mojito

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Select device"
        required: true
        type: choice
        options:
          - sunny
          - mojito
        default: sunny
      usb_automount:
        description: "Experimental: auto-mount USB flash drive inside recovery"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      FOX_BRANCH: fox_12.1
      FOX_BUILD_TYPE: Unofficial
      FOX_MAINTAINER_PATCH_VERSION: "0"
      MAINTAINER_NAME: Abdalla
      LC_ALL: C
      ALLOW_MISSING_DEPENDENCIES: "true"
      USE_CCACHE: "0"
      GIT_TERMINAL_PROMPT: "0"
      DEBIAN_FRONTEND: noninteractive

    steps:
      # ------------------------------------------------------------
      - name: Set device variables
        shell: bash
        run: |
          set -e

          DEVICE="${{ inputs.device }}"

          case "$DEVICE" in
            sunny|mojito) ;;
            *) echo "Unsupported device: $DEVICE"; exit 1 ;;
          esac

          {
            echo "DEVICE=$DEVICE"
            echo "DEVICE_TREE=$DEVICE"
            echo "FOX_BUILD_DEVICE=$DEVICE"
          } >> "$GITHUB_ENV"

          echo "Device: $DEVICE"

      # ------------------------------------------------------------
      - name: Free disk space
        run: |
          set +e

          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/share/swift
          sudo rm -rf /usr/share/miniconda
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean

          df -h
          exit 0

      # ------------------------------------------------------------
      - name: Add swap (avoid out-of-memory)
        run: |
          set +e
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          if sudo fallocate -l 10G /mnt/swapfile; then
            sudo chmod 600 /mnt/swapfile
            sudo mkswap /mnt/swapfile
            sudo swapon /mnt/swapfile
          else
            echo "Could not create swap, continuing without it."
          fi
          free -h
          exit 0

      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            curl \
            fontconfig \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            lib32ncurses-dev \
            lib32z1-dev \
            libc6-dev-i386 \
            libgl1-mesa-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libx11-dev \
            libxml2 \
            libxml2-utils \
            lz4 \
            lzop \
            pngcrush \
            python3 \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            x11proto-core-dev \
            xsltproc \
            xz-utils \
            zip \
            zlib1g-dev

      # ------------------------------------------------------------
      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false
          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      # ------------------------------------------------------------
      - name: Install repo
        shell: bash
        run: |
          set -eux

          mkdir -p "${HOME}/bin"

          curl -L --r
