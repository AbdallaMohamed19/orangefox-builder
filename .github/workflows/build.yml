name: Build OrangeFox - Sunny / Mojito

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Select device"
        required: true
        type: choice
        options:
          - sunny
          - mojito
        default: mojito

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      # OrangeFox manifest branch
      FOX_BRANCH: fox_12.1

      # DO NOT define FOX_VERSION.
      # OrangeFox determines its release version internally.
      FOX_MAINTAINER_PATCH_VERSION: "0"

      OF_MAINTAINER: Abdalla

      # Android build environment
      LC_ALL: C
      LANG: C
      ALLOW_MISSING_DEPENDENCIES: "true"

      # ccache
      USE_CCACHE: "1"
      CCACHE_EXEC: /usr/bin/ccache
      CCACHE_DIR: /home/runner/.ccache

      GIT_TERMINAL_PROMPT: "0"

      # Keep parallelism conservative because GitHub runner RAM is limited.
      BUILD_JOBS: "2"

    steps:

      # ============================================================
      # DEVICE
      # ============================================================

      - name: Set device variables
        shell: bash
        run: |
          set -euo pipefail

          DEVICE="${{ inputs.device }}"

          case "${DEVICE}" in
            sunny|mojito)
              ;;
            *)
              echo "ERROR: Unsupported device: ${DEVICE}"
              exit 1
              ;;
          esac

          {
            echo "DEVICE=${DEVICE}"
            echo "DEVICE_TREE=${DEVICE}"
            echo "FOX_BUILD_DEVICE=${DEVICE}"
          } >> "${GITHUB_ENV}"

          echo "============================================"
          echo "Selected device: ${DEVICE}"
          echo "Device tree:     ${DEVICE}"
          echo "FOX branch:      ${FOX_BRANCH}"
          echo "Build jobs:      ${BUILD_JOBS}"
          echo "============================================"

      # ============================================================
      # DISK
      # ============================================================

      - name: Free disk space
        shell: bash
        run: |
          set -eux

          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true

          sudo docker image prune --all --force || true
          sudo apt-get clean

          echo "===== DISK ====="
          df -h

      # ============================================================
      # SWAP
      # ============================================================

      - name: Add swap
        shell: bash
        run: |
          set -e

          sudo swapoff -a || true
          sudo rm -f /mnt/swapfile

          sudo fallocate -l 12G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile

          echo "===== MEMORY ====="
          free -h

          echo "===== SWAP ====="
          swapon --show

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install build dependencies
        shell: bash
        run: |
          set -eux

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            fontconfig \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            gperf \
            lib32ncurses-dev \
            lib32z1-dev \
            libc6-dev-i386 \
            libgl1-mesa-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libx11-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            python3 \
            python-is-python3 \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            x11proto-core-dev \
            xsltproc \
            xz-utils \
            zip \
            zlib1g-dev

          python --version
          python3 --version
          git --version
          ccache --version

      # ============================================================
      # GIT
      # ============================================================

      - name: Configure git
        shell: bash
        run: |
          set -eux

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"
          git config --global color.ui false

          git config --global http.postBuffer 524288000
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999

      # ============================================================
      # REPO
      # ============================================================

      - name: Install repo
        shell: bash
        run: |
          set -eux

          mkdir -p "${HOME}/bin"

          curl -L \
            --retry 5 \
            --retry-delay 5 \
            --fail \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"

          chmod +x "${HOME}/bin/repo"

          echo "${HOME}/bin" >> "${GITHUB_PATH}"

          "${HOME}/bin/repo" version

      # ============================================================
      # ORANGEFOX SOURCE
      # ============================================================

      - name: Sync OrangeFox source
        shell: bash
        run: |
          set -euo pipefail

          cd "${HOME}"

          rm -rf OrangeFox_sync
          rm -rf fox_12.1

          echo "Cloning OrangeFox sync repository..."

          for attempt in 1 2 3; do
            if git clone \
              --depth=1 \
              https://gitlab.com/OrangeFox/sync.git \
              OrangeFox_sync; then
              break
            fi

            echo "Clone attempt ${attempt} failed."

            rm -rf OrangeFox_sync

            if [ "${attempt}" -eq 3 ]; then
              echo "ERROR: Could not clone OrangeFox sync repository."
              exit 1
            fi

            sleep 15
          done

          SYNC_SCRIPT="$(
            find "${HOME}/OrangeFox_sync" \
              -type f \
              -name "orangefox_sync.sh" \
              -print -quit
          )"

          if [ -z "${SYNC_SCRIPT}" ]; then
            echo "ERROR: orangefox_sync.sh not found."
            find "${HOME}/OrangeFox_sync" -maxdepth 3 -type f | head -100
            exit 1
          fi

          echo "Using sync script:"
          echo "${SYNC_SCRIPT}"

          chmod +x "${SYNC_SCRIPT}"

          cd "$(dirname "${SYNC_SCRIPT}")"

          SUCCESS=0

          for attempt in 1 2 3; do
            echo "============================================"
            echo "OrangeFox sync attempt ${attempt}"
            echo "============================================"

            if ./orangefox_sync.sh \
              --branch 12.1 \
              --path "${HOME}/fox_12.1"; then

              SUCCESS=1
              break
            fi

            echo "Sync failed."

            if [ "${attempt}" -lt 3 ]; then
              sleep 30
            fi
          done

          if [ "${SUCCESS}" -ne 1 ]; then
            echo "ERROR: OrangeFox source sync failed."
            exit 1
          fi

          test -d "${HOME}/fox_12.1"
          test -d "${HOME}/fox_12.1/vendor/recovery"

          echo "OrangeFox source sync completed."

          df -h

      # ============================================================
      # DEVICE TREE
      # ============================================================

      - name: Sync device tree
        shell: bash
        run: |
          set -euo pipefail

          cd "${HOME}/fox_12.1"

          DEVICE_PATH="device/xiaomi/${DEVICE_TREE}"

          rm -rf "${DEVICE_PATH}"
          mkdir -p "device/xiaomi"

          echo "============================================"
          echo "Device: ${DEVICE}"
          echo "Device tree: ${DEVICE_PATH}"
          echo "============================================"

          # Official OrangeFox GitLab device repository.
          DEVICE_REPO="https://gitlab.com/OrangeFox/device/${DEVICE_TREE}.git"

          echo "Trying:"
          echo "${DEVICE_REPO}"

          if git ls-remote --exit-code "${DEVICE_REPO}" >/dev/null 2>&1; then

            git clone \
              --depth=1 \
              -b "${FOX_BRANCH}" \
              "${DEVICE_REPO}" \
              "${DEVICE_PATH}"

          else

            echo "The OrangeFox GitLab repository/branch was not available."

            echo ""
            echo "IMPORTANT:"
            echo "A device tree is mandatory for building OrangeFox."
            echo "Do not silently substitute an unrelated device tree."
            echo ""

            exit 1
          fi

          echo "Device tree cloned successfully."

          ls -la "${DEVICE_PATH}"

      # ============================================================
      # DEVICE TREE VALIDATION
      # ============================================================

      - name: Validate device tree
        shell: bash
        run: |
          set -euo pipefail

          DEVICE_PATH="${HOME}/fox_12.1/device/xiaomi/${DEVICE_TREE}"

          echo "Validating:"
          echo "${DEVICE_PATH}"

          REQUIRED_FILES=(
            "AndroidProducts.mk"
            "BoardConfig.mk"
          )

          for file in "${REQUIRED_FILES[@]}"; do
            if [ ! -f "${DEVICE_PATH}/${file}" ]; then
              echo "ERROR: Missing ${file}"
              exit 1
            fi
          done

          if [ ! -f "${DEVICE_PATH}/vendorsetup.sh" ] &&
             [ ! -f "${DEVICE_PATH}/AndroidProducts.mk" ]; then
            echo "ERROR: Device tree does not appear to be a valid Android device tree."
            exit 1
          fi

          echo ""
          echo "===== PRODUCT FILES ====="

          find "${DEVICE_PATH}" \
            -maxdepth 1 \
            -type f \
            \( -name "*.mk" -o -name "*.sh" \) \
            -print

          echo ""
          echo "Device tree validation passed."

      # ============================================================
      # CCACHE
      # ============================================================

      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.device }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ inputs.device }}-

      - name: Configure ccache
        shell: bash
        run: |
          set -eux

          mkdir -p "${CCACHE_DIR}"

          ccache -M 20G
          ccache --set-config=compression=true
          ccache --set-config=max_size=20G

          ccache -z
          ccache -s

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build OrangeFox
        shell: bash
        timeout-minutes: 300
        run: |
          set -eo pipefail

          cd "${HOME}/fox_12.1"

          # OrangeFox explicitly requires FOX_BUILD_DEVICE
          # to be exported before building.
          export FOX_BUILD_DEVICE="${DEVICE}"

          echo "============================================"
          echo "OrangeFox build"
          echo "============================================"
          echo "Device:        ${DEVICE}"
          echo "Build device:  ${FOX_BUILD_DEVICE}"
          echo "Branch:        ${FOX_BRANCH}"
          echo "Maintainer:    ${OF_MAINTAINER}"
          echo "Patch version: ${FOX_MAINTAINER_PATCH_VERSION}"
          echo "Jobs:          ${BUILD_JOBS}"
          echo "============================================"

          # Load Android build environment.
          source build/envsetup.sh

          # The OrangeFox device trees normally expose twrp_<device>-eng.
          TARGET="twrp_${DEVICE}-eng"

          echo "Trying lunch target:"
          echo "${TARGET}"

          lunch "${TARGET}"

          echo ""
          echo "===== BUILD VARIABLES ====="

          get_build_var TARGET_PRODUCT
          get_build_var TARGET_DEVICE
          get_build_var TARGET_ARCH
          get_build_var TARGET_BUILD_VARIANT

          echo ""
          echo "===== ORANGEFOX VARIABLES ====="

          env | grep -E \
            '^(FOX_|OF_)' \
            | sort \
            || true

          echo ""
          echo "===== MEMORY ====="
          free -h

          echo ""
          echo "===== DISK ====="
          df -h

          echo ""
          echo "===== CCACHE ====="
          ccache -s || true

          # --------------------------------------------------------
          # Do not guess A/B from arbitrary device-tree strings.
          #
          # OrangeFox provides FOX_AB_DEVICE for A/B devices.
          # We first check the resulting build environment.
          # --------------------------------------------------------

          if grep -RqsE \
            '(^|[[:space:]])(FOX_AB_DEVICE|OF_AB_DEVICE)[[:space:]]*[:?]?=' \
            "device/xiaomi/${DEVICE_TREE}"; then

            echo "A/B configuration detected from device tree."

            export FOX_AB_DEVICE=1

          fi

          # Virtual A/B devices on fox_12.1 may need the dedicated
          # OrangeFox variable. Only enable it when explicitly declared
          # by the device tree.
          if grep -RqsE \
            '(^|[[:space:]])FOX_VIRTUAL_AB_DEVICE[[:space:]]*[:?]?=[[:space:]]*1' \
            "device/xiaomi/${DEVICE_TREE}"; then

            echo "Virtual A/B configuration detected."

            export FOX_VIRTUAL_AB_DEVICE=1
          fi

          echo ""
          echo "===== FINAL ORANGEFOX VARIABLES ====="

          env | grep -E \
            '^(FOX_|OF_)' \
            | sort \
            || true

          echo ""
          echo "===== START BUILD ====="

          # Use a conservative job count for the GitHub runner.
          mka -j"${BUILD_JOBS}" \
            recoveryimage \
            2>&1 | tee "${HOME}/build.log"

          echo ""
          echo "===== BUILD FINISHED ====="

      # ============================================================
      # CCACHE SAVE
      # ============================================================

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.ccache
          key: ccache-${{ inputs.device }}-${{ github.run_id }}

      # ============================================================
      # OUTPUT
      # ============================================================

      - name: Show build output
        if: always()
        shell: bash
        run: |
          set +e

          PRODUCT_OUT="${HOME}/fox_12.1/out/target/product/${DEVICE}"

          echo "============================================"
          echo "PRODUCT OUTPUT"
          echo "============================================"

          if [ -d "${PRODUCT_OUT}" ]; then

            ls -lah "${PRODUCT_OUT}"

            echo ""
            echo "===== IMAGES ====="

            find "${PRODUCT_OUT}" \
              -maxdepth 1 \
              -type f \
              -name "*.img" \
              -print

            echo ""
            echo "===== ZIP FILES ====="

            find "${PRODUCT_OUT}" \
              -maxdepth 1 \
              -type f \
              -name "*.zip" \
              -print

          else

            echo "Product output directory does not exist."

          fi

      # ============================================================
      # UPLOAD RECOVERY
      # ============================================================

      - name: Upload OrangeFox
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-${{ inputs.device }}-fox12.1
          if-no-files-found: error
          compression-level: 9
          path: |
            /home/runner/fox_12.1/out/target/product/${{ inputs.device }}/OrangeFox*.img
            /home/runner/fox_12.1/out/target/product/${{ inputs.device }}/recovery.img
            /home/runner/fox_12.1/out/target/product/${{ inputs.device }}/boot.img
            /home/runner/fox_12.1/out/target/product/${{ inputs.device }}/OrangeFox*.zip

      # ============================================================
      # LOG
      # ============================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ inputs.device }}
          if-no-files-found: ignore
          compression-level: 9
          path: /home/runner/build.log

      # ============================================================
      # CCACHE STATS
      # ============================================================

      - name: Ccache statistics
        if: always()
        shell: bash
        run: |
          ccache -s || true
