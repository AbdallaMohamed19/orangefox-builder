name: Build OrangeFox 12.1 - mojito

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04

    env:
      FOX_PATH: ${{ github.workspace }}/fox_12.1

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euxo pipefail

          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo docker system prune -af || true

          echo "Disk after cleanup:"
          df -h

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git lfs install

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global color.ui false

      - name: Install repo tool
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download OrangeFox sync tools
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf OrangeFox_sync

          mkdir -p OrangeFox_sync

          cd OrangeFox_sync

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git

          test -f sync/orangefox_sync.sh

          chmod +x sync/orangefox_sync.sh

          echo "OrangeFox sync tool:"
          ls -la sync/orangefox_sync.sh

      - name: Sync OrangeFox 12.1
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/OrangeFox_sync/sync"

          rm -rf "$FOX_PATH"

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$FOX_PATH"

      - name: Verify OrangeFox source
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          test -d build
          test -d bootable/recovery
          test -d vendor/recovery
          test -d .repo

          echo "OrangeFox source OK."

      - name: Clone mojito device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          rm -rf device/xiaomi/mojito

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_mojito.git \
            device/xiaomi/mojito

      - name: Clone SM6150 common tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          rm -rf device/xiaomi/sm6150-common

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_sm6150-common.git \
            device/xiaomi/sm6150-common

      - name: Clone mojito kernel
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p kernel/xiaomi

          rm -rf kernel/xiaomi/mojito

          git clone \
            --depth=1 \
            https://github.com/nebrassy/android_kernel_xiaomi_mojito.git \
            kernel/xiaomi/mojito

      - name: Verify device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          test -f device/xiaomi/mojito/AndroidProducts.mk
          test -f device/xiaomi/mojito/BoardConfig.mk
          test -f device/xiaomi/mojito/device.mk
          test -f device/xiaomi/mojito/twrp_mojito.mk

          echo "Device tree OK."

          echo ""
          echo "AndroidProducts.mk:"
          cat device/xiaomi/mojito/AndroidProducts.mk

          echo ""
          echo "Dependencies:"
          cat device/xiaomi/mojito/twrp.dependencies || true

      - name: Verify kernel
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          test -d kernel/xiaomi/mojito
          test -f kernel/xiaomi/mojito/Makefile

          echo "Kernel OK."

      # ============================================================
      # IMPORTANT:
      # Do NOT use "set -u" here.
      # Android envsetup.sh expects some variables to be unset.
      # ============================================================

      - name: Setup Android build environment
        shell: bash
        run: |
          set -eo pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================"
          echo "Loading Android build environment"
          echo "============================================"

          source build/envsetup.sh

          echo ""
          echo "============================================"
          echo "Testing mojito lunch target"
          echo "============================================"

          lunch twrp_mojito-eng

          echo ""
          echo "Lunch successful."

          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-}"
          echo "TARGET_DEVICE=${TARGET_DEVICE:-}"

      - name: Build OrangeFox recovery
        shell: bash
        run: |
          set -eo pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================"
          echo "Loading Android build environment"
          echo "============================================"

          source build/envsetup.sh

          echo ""
          echo "============================================"
          echo "Selecting mojito"
          echo "============================================"

          lunch twrp_mojito-eng

          echo ""
          echo "============================================"
          echo "BUILDING ORANGEFOX"
          echo "============================================"

          mka recoveryimage

      - name: Show build output
        if: always()
        run: |
          set +e

          cd "$FOX_PATH"

          echo "============================================"
          echo "BUILD OUTPUT"
          echo "============================================"

          if [ -d out/target/product/mojito ]; then

            ls -lah out/target/product/mojito

            echo ""
            echo "Recovery files:"
            echo "--------------------------------------------"

            find out/target/product/mojito \
              -maxdepth 1 \
              -type f \
              \( \
                -name "*.img" \
                -o -name "*.zip" \
                -o -name "recovery*" \
              \) \
              -print

          else
            echo "Output directory does not exist."
          fi

      - name: Upload recovery images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-images
          path: |
            fox_12.1/out/target/product/mojito/recovery.img
            fox_12.1/out/target/product/mojito/vendor_boot.img
            fox_12.1/out/target/product/mojito/boot.img
          if-no-files-found: warn

      - name: Upload recovery zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-zip
          path: |
            fox_12.1/out/target/product/mojito/*.zip
          if-no-files-found: warn
