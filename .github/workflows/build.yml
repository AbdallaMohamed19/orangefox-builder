name: Build OrangeFox - mojito

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout
        uses: actions/checkout@v4

      # ==========================================
      # 2. Install dependencies
      # ==========================================
      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            gnupg \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      # ==========================================
      # 3. Install repo
      # ==========================================
      - name: Install repo
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      # ==========================================
      # 4. Initialize OrangeFox
      # ==========================================
      - name: Initialize OrangeFox
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/orangefox"

          cd "$GITHUB_WORKSPACE/orangefox"

          repo init \
            -u https://gitlab.com/OrangeFox/Manifest.git \
            -b fox_12.1 \
            --depth=1

      # ==========================================
      # 5. Sync OrangeFox
      # ==========================================
      - name: Sync OrangeFox
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/orangefox"

          repo sync \
            --force-sync \
            --no-clone-bundle \
            --no-tags \
            --optimized-fetch \
            --prune \
            -c \
            -j"$(nproc --all)"

      # ==========================================
      # 6. Check device tree
      # ==========================================
      - name: Check mojito device tree
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/orangefox"

          echo "======================================"
          echo "Checking mojito device tree"
          echo "======================================"

          if [ ! -d "device/xiaomi/mojito" ]; then
            echo "ERROR:"
            echo "device/xiaomi/mojito does not exist."
            echo ""
            echo "The workflow cannot continue without"
            echo "a compatible OrangeFox/TWRP device tree."
            exit 1
          fi

          echo "Device tree found."

          ls -la device/xiaomi/mojito

      # ==========================================
      # 7. Debug vendorsetup.sh
      # ==========================================
      - name: Debug vendorsetup
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/orangefox"

          echo "======================================"
          echo "vendorsetup.sh"
          echo "======================================"

          if [ ! -f "device/xiaomi/mojito/vendorsetup.sh" ]; then
            echo "ERROR: vendorsetup.sh does not exist."
            exit 1
          fi

          echo "File exists."

          echo ""
          echo "----- FILE CONTENT -----"

          cat device/xiaomi/mojito/vendorsetup.sh

          echo ""
          echo "----- SHELL CHECK -----"

          bash -n device/xiaomi/mojito/vendorsetup.sh

          echo "vendorsetup.sh syntax OK."

      # ==========================================
      # 8. Prepare build environment
      # ==========================================
      - name: Prepare OrangeFox build environment
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/orangefox"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "======================================"
          echo "Loading build environment"
          echo "======================================"

          source build/envsetup.sh

          echo ""
          echo "======================================"
          echo "Loading mojito vendorsetup"
          echo "======================================"

          set +e

          source device/xiaomi/mojito/vendorsetup.sh

          STATUS=$?

          set -e

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "======================================"
            echo "vendorsetup.sh FAILED"
            echo "exit code: $STATUS"
            echo "======================================"

            exit "$STATUS"
          fi

          echo ""
          echo "vendorsetup.sh loaded successfully."

          echo ""
          echo "======================================"
          echo "OrangeFox variables"
          echo "======================================"

          env | grep -E '^(FOX_|OF_|TW_)' || true

      # ==========================================
      # 9. Find valid lunch target
      # ==========================================
      - name: Find mojito lunch target
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/orangefox"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          echo "======================================"
          echo "Searching for mojito targets"
          echo "======================================"

          lunch mojito-eng || true
          lunch twrp_mojito-eng || true

          echo ""
          echo "Available mojito references:"
          grep -R "PRODUCT_DEVICE.*mojito\|COMMON_LUNCH_CHOICES.*mojito" \
            device/xiaomi/mojito \
            2>/dev/null || true

      # ==========================================
      # 10. Build
      # ==========================================
      - name: Build OrangeFox Recovery
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/orangefox"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          source build/envsetup.sh

          echo "======================================"
          echo "Build target detection"
          echo "======================================"

          TARGET=""

          if lunch twrp_mojito-eng; then
            TARGET="twrp_mojito-eng"
          elif lunch mojito-eng; then
            TARGET="mojito-eng"
          else
            echo "ERROR: No mojito lunch target found."
            exit 1
          fi

          echo "Using target: $TARGET"

          echo ""
          echo "======================================"
          echo "Starting OrangeFox build"
          echo "======================================"

          mka recoveryimage

      # ==========================================
      # 11. Show output
      # ==========================================
      - name: Show Build Output
        if: always()
        run: |
          set +e

          cd "$GITHUB_WORKSPACE/orangefox"

          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          if [ -d "out/target/product/mojito" ]; then

            ls -lah out/target/product/mojito

            echo ""
            echo "Recovery files:"
            echo "--------------------------------------"

            find out/target/product/mojito \
              -maxdepth 1 \
              -type f \
              \( \
                -name "*.img" \
                -o -name "*.zip" \
                -o -name "recovery*" \
              \) \
              -print

          else

            echo "Output directory does not exist."

          fi

      # ==========================================
      # 12. Upload
      # ==========================================
      - name: Upload Recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito
          path: |
            orangefox/out/target/product/mojito/*.zip
            orangefox/out/target/product/mojito/*.img
            orangefox/out/target/product/mojito/recovery*
          if-no-files-found: warn
