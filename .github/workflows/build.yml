name: Build OrangeFox for Mojito

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          remove-dotnet: 'true'
          remove-android: 'false'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Set up Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick lib32ncurses5-dev lib32z1-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev

      - name: Sync OrangeFox Source & Device Tree
        run: |
          mkdir -p ~/orangefox
          cd ~/orangefox
          git config --global user.name "AbdallaMohamed19"
          git config --global user.email "abdalla@example.com"
          # أضف أوامر المزامنة الخاصة بك هنا إذا كان لديك أمر repo init/sync

      - name: Build OrangeFox
        run: |
          # أضف أوامر البناء الخاصة بك هنا

      - name: Upload Recovery
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox_Recovery
          path: ~/orangefox/out/target/product/mojito/*.img
