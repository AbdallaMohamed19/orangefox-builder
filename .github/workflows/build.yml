name: Build OrangeFox 12.1 - mojito

on:
  workflow_dispatch:

jobs:
  build:
    name: Build OrangeFox Recovery
    runs-on: ubuntu-22.04

    env:
      FOX_PATH: ${{ github.workspace }}/fox_12.1

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: Checkout repository
        uses: actions/checkout@v4


      # ============================================================
      # 2. Free disk space
      # ============================================================

      - name: Free disk space
        run: |
          set -euxo pipefail

          echo "Disk before cleanup:"
          df -h

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo docker system prune -af || true

          echo "Disk after cleanup:"
          df -h


      # ============================================================
      # 3. Dependencies
      # ============================================================

      - name: Install build dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git lfs install

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git config --global color.ui false


      # ============================================================
      # 4. Repo tool
      # ============================================================

      - name: Install repo tool
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"


      # ============================================================
      # 5. OrangeFox sync tool
      # ============================================================

      - name: Download OrangeFox sync tools
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf OrangeFox_sync

          mkdir -p OrangeFox_sync

          cd OrangeFox_sync

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git

          test -f sync/orangefox_sync.sh

          chmod +x sync/orangefox_sync.sh

          echo "OrangeFox sync tool:"
          ls -lh sync/orangefox_sync.sh


      # ============================================================
      # 6. Sync OrangeFox 12.1
      # ============================================================

      - name: Sync OrangeFox 12.1
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/OrangeFox_sync/sync"

          rm -rf "$FOX_PATH"

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$FOX_PATH"


      # ============================================================
      # 7. Verify OrangeFox source
      # ============================================================

      - name: Verify OrangeFox source
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "ORANGEFOX SOURCE CHECK"
          echo "============================================"

          test -d .repo
          test -d build
          test -d bootable/recovery
          test -d vendor/recovery

          echo "OrangeFox source OK."

          echo ""
          echo "Source size:"
          du -sh "$FOX_PATH" || true


      # ============================================================
      # 8. Device tree
      # ============================================================

      - name: Clone mojito device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          rm -rf device/xiaomi/mojito

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_mojito.git \
            device/xiaomi/mojito

          echo "Mojito device tree:"
          ls -la device/xiaomi/mojito


      # ============================================================
      # 9. Common device tree
      # ============================================================

      - name: Clone SM6150 common tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          rm -rf device/xiaomi/sm6150-common

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_sm6150-common.git \
            device/xiaomi/sm6150-common

          echo "SM6150 common tree:"
          ls -la device/xiaomi/sm6150-common


      # ============================================================
      # 10. Kernel
      # ============================================================

      - name: Clone mojito kernel
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p kernel/xiaomi

          rm -rf kernel/xiaomi/mojito

          git clone \
            --depth=1 \
            https://github.com/nebrassy/android_kernel_xiaomi_mojito.git \
            kernel/xiaomi/mojito

          echo "Mojito kernel:"
          ls -la kernel/xiaomi/mojito


      # ============================================================
      # 11. Verify device tree
      # ============================================================

      - name: Verify device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "DEVICE TREE CHECK"
          echo "============================================"

          test -f device/xiaomi/mojito/AndroidProducts.mk
          test -f device/xiaomi/mojito/BoardConfig.mk
          test -f device/xiaomi/mojito/device.mk
          test -f device/xiaomi/mojito/twrp_mojito.mk

          echo "Device tree files OK."

          echo ""
          echo "AndroidProducts.mk:"
          cat device/xiaomi/mojito/AndroidProducts.mk

          echo ""
          echo "Dependencies:"
          cat device/xiaomi/mojito/twrp.dependencies || true


      # ============================================================
      # 12. Verify kernel
      # ============================================================

      - name: Verify kernel
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "KERNEL CHECK"
          echo "============================================"

          test -d kernel/xiaomi/mojito
          test -f kernel/xiaomi/mojito/Makefile

          echo "Kernel OK."

          du -sh kernel/xiaomi/mojito


      # ============================================================
      # 13. DIAGNOSE ENVSETUP
      #
      # IMPORTANT:
      # No "set -u" here.
      # We deliberately capture the exit code.
      # ============================================================

      - name: Diagnose Android build environment
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================"
          echo "ANDROID BUILD ENVIRONMENT DIAGNOSTICS"
          echo "============================================"

          echo ""
          echo "Current directory:"
          pwd

          echo ""
          echo "Top-level files:"
          ls -la | head -100

          echo ""
          echo "Checking build/envsetup.sh:"
          ls -lh build/envsetup.sh

          echo ""
          echo "Checking important directories:"

          for DIR in \
            build \
            build/make \
            device \
            vendor \
            product \
            bootable \
            bootable/recovery
          do
            if [ -d "$DIR" ]; then
              echo "OK: $DIR"
            else
              echo "MISSING: $DIR"
            fi
          done

          echo ""
          echo "Checking mojito tree:"
          ls -la device/xiaomi/mojito || true

          echo ""
          echo "Checking envsetup syntax:"
          bash -n build/envsetup.sh

          echo ""
          echo "============================================"
          echo "RUNNING ENVSETUP WITH TRACE"
          echo "============================================"

          set +e

          PS4='+ ENVSETUP:${BASH_SOURCE}:${LINENO}: '

          set -x

          source build/envsetup.sh

          STATUS=$?

          set +x

          echo ""
          echo "============================================"
          echo "ENVSETUP EXIT CODE: $STATUS"
          echo "============================================"

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "envsetup.sh FAILED."
            echo ""
            echo "The complete trace above contains the"
            echo "actual command that failed."
            exit "$STATUS"
          fi

          echo ""
          echo "envsetup.sh completed successfully."


      # ============================================================
      # 14. Test lunch
      # ============================================================

      - name: Test mojito lunch target
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================"
          echo "LOADING ENVIRONMENT"
          echo "============================================"

          source build/envsetup.sh

          echo ""
          echo "============================================"
          echo "TESTING LUNCH"
          echo "============================================"

          lunch twrp_mojito-eng

          echo ""
          echo "Lunch completed successfully."

          echo ""
          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-}"
          echo "TARGET_DEVICE=${TARGET_DEVICE:-}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-}"


      # ============================================================
      # 15. Build
      # ============================================================

      - name: Build OrangeFox recovery
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================"
          echo "LOADING BUILD ENVIRONMENT"
          echo "============================================"

          source build/envsetup.sh

          echo ""
          echo "============================================"
          echo "SELECTING MOJITO"
          echo "============================================"

          lunch twrp_mojito-eng

          echo ""
          echo "============================================"
          echo "BUILDING RECOVERY"
          echo "============================================"

          mka recoveryimage


      # ============================================================
      # 16. Show output
      # ============================================================

      - name: Show build output
        if: always()
        run: |
          set +e

          cd "$FOX_PATH"

          echo "============================================"
          echo "BUILD OUTPUT"
          echo "============================================"

          if [ -d out/target/product/mojito ]; then

            echo ""
            echo "Output directory:"
            ls -lah out/target/product/mojito

            echo ""
            echo "Recovery files:"
            echo "--------------------------------------------"

            find out/target/product/mojito \
              -maxdepth 1 \
              -type f \
              \( \
                -name "*.img" \
                -o -name "*.zip" \
                -o -name "recovery*" \
              \) \
              -print

          else

            echo "Output directory does not exist."

          fi


      # ============================================================
      # 17. Upload images
      # ============================================================

      - name: Upload recovery images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-images
          path: |
            fox_12.1/out/target/product/mojito/recovery.img
            fox_12.1/out/target/product/mojito/vendor_boot.img
            fox_12.1/out/target/product/mojito/boot.img
          if-no-files-found: warn


      # ============================================================
      # 18. Upload ZIP
      # ============================================================

      - name: Upload recovery zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-zip
          path: |
            fox_12.1/out/target/product/mojito/*.zip
          if-no-files-found: warn
