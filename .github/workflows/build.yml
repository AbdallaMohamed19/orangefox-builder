name: Build OrangeFox 12.1 - mojito

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      FOX_PATH: ${{ github.workspace }}/fox_12.1

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo docker system prune -af || true

          df -h

      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git lfs install

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Install repo
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Download OrangeFox sync
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf OrangeFox_sync

          mkdir OrangeFox_sync

          cd OrangeFox_sync

          git clone \
            --depth=1 \
            https://gitlab.com/OrangeFox/sync.git

          test -f sync/orangefox_sync.sh

          chmod +x sync/orangefox_sync.sh

      - name: Sync OrangeFox 12.1
        run: |
          set -euxo pipefail

          cd "$GITHUB_WORKSPACE/OrangeFox_sync/sync"

          rm -rf "$FOX_PATH"

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$FOX_PATH"

      - name: Clone mojito device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p device/xiaomi

          rm -rf device/xiaomi/mojito

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_mojito.git \
            device/xiaomi/mojito

      - name: Clone SM6150 common
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p device/xiaomi

          rm -rf device/xiaomi/sm6150-common

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_sm6150-common.git \
            device/xiaomi/sm6150-common

      - name: Clone mojito kernel
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p kernel/xiaomi

          rm -rf kernel/xiaomi/mojito

          git clone \
            --depth=1 \
            https://github.com/nebrassy/android_kernel_xiaomi_mojito.git \
            kernel/xiaomi/mojito

      # ============================================================
      # CHECK THE FILE THAT CAUSED ENVSETUP TO RETURN 1
      # ============================================================

      - name: Check OrangeFox required files
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "CHECKING ORANGEFOX FILES"
          echo "============================================"

          echo ""
          echo "Checking envsetup:"
          ls -lh build/envsetup.sh

          echo ""
          echo "Checking build/make:"
          ls -ld build/make || true

          echo ""
          echo "Checking frameworks/base:"
          ls -ld frameworks/base || true

          echo ""
          echo "Checking XSD directory:"
          ls -la frameworks/base/services/core/xsd 2>/dev/null || true

          echo ""
          echo "Checking VTS directory:"
          ls -la frameworks/base/services/core/xsd/vts 2>/dev/null || true

          echo ""
          echo "Checking required Android.mk:"
          if [ -f frameworks/base/services/core/xsd/vts/Android.mk ]; then
            echo "FOUND:"
            ls -lh frameworks/base/services/core/xsd/vts/Android.mk
          else
            echo "MISSING:"
            echo "frameworks/base/services/core/xsd/vts/Android.mk"
          fi

          echo ""
          echo "Searching related Android.mk files:"

          find frameworks/base/services/core/xsd \
            -maxdepth 6 \
            -type f \
            -name "Android.mk" \
            2>/dev/null | sort || true

      # ============================================================
      # ENVSETUP
      # ============================================================

      - name: Setup Android environment
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================"
          echo "LOADING ANDROID ENVIRONMENT"
          echo "============================================"

          set +e

          source build/envsetup.sh

          STATUS=$?

          set -e

          echo ""
          echo "envsetup.sh returned: $STATUS"

          echo ""
          echo "TOP=${TOP:-}"
          echo "OUT=${OUT:-}"
          echo "OUT_DIR=${OUT_DIR:-}"
          echo "FOX_MANIFEST_ROOT=${FOX_MANIFEST_ROOT:-}"

          if [ "$STATUS" -ne 0 ]; then
            echo ""
            echo "WARNING:"
            echo "OrangeFox envsetup returned non-zero."
            echo "Continuing for diagnostic purposes."
          fi

      # ============================================================
      # LUNCH
      # ============================================================

      - name: Test mojito lunch
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================"
          echo "LOADING ENVIRONMENT"
          echo "============================================"

          set +e
          source build/envsetup.sh
          ENV_STATUS=$?
          set -e

          echo "envsetup status: $ENV_STATUS"

          echo ""
          echo "============================================"
          echo "LUNCH"
          echo "============================================"

          lunch twrp_mojito-eng

          echo ""
          echo "============================================"
          echo "LUNCH RESULT"
          echo "============================================"

          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-}"
          echo "TARGET_DEVICE=${TARGET_DEVICE:-}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-}"

      # ============================================================
      # BUILD
      # ============================================================

      - name: Build OrangeFox
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================"
          echo "LOADING ENVIRONMENT"
          echo "============================================"

          set +e
          source build/envsetup.sh
          ENV_STATUS=$?
          set -e

          echo "envsetup status: $ENV_STATUS"

          echo ""
          echo "============================================"
          echo "LUNCH MOJITO"
          echo "============================================"

          lunch twrp_mojito-eng

          echo ""
          echo "============================================"
          echo "BUILDING RECOVERY"
          echo "============================================"

          mka recoveryimage

      # ============================================================
      # OUTPUT
      # ============================================================

      - name: Show output
        if: always()
        run: |
          set +e

          cd "$FOX_PATH"

          echo "============================================"
          echo "BUILD OUTPUT"
          echo "============================================"

          if [ -d out/target/product/mojito ]; then

            ls -lah out/target/product/mojito

            echo ""
            echo "Recovery files:"

            find out/target/product/mojito \
              -maxdepth 1 \
              -type f \
              \( \
                -name "*.img" \
                -o -name "*.zip" \
                -o -name "recovery*" \
              \) \
              -print

          else

            echo "No output directory."

          fi

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload recovery images
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-images
          path: |
            fox_12.1/out/target/product/mojito/recovery.img
            fox_12.1/out/target/product/mojito/vendor_boot.img
            fox_12.1/out/target/product/mojito/boot.img
          if-no-files-found: warn

      - name: Upload recovery zip
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-zip
          path: |
            fox_12.1/out/target/product/mojito/*.zip
          if-no-files-found: warn
