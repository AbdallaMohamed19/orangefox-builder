name: Build OrangeFox - Mojito with OTG storage

on:
  workflow_dispatch:
    inputs:
      force_otg:
        description: "Force add USB OTG storage entry if missing"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    env:
      FOX_BRANCH: fox_12.1
      FOX_BUILD_TYPE: Unofficial
      MAINTAINER_NAME: Abdalla
      DEVICE: mojito
      DEVICE_TREE: mojito
      LC_ALL: C
      ALLOW_MISSING_DEPENDENCIES: "true"
      USE_CCACHE: "0"
      GIT_TERMINAL_PROMPT: "0"
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Free disk space
        run: |
          set +e
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /usr/share/miniconda \
            /opt/hostedtoolcache/CodeQL /usr/local/lib/node_modules
          sudo docker image prune --all --force
          sudo apt-get clean
          df -h
          exit 0

      - name: Add swap
        run: |
          set +e
          sudo swapoff -a
          sudo rm -f /mnt/swapfile
          sudo fallocate -l 10G /mnt/swapfile
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h
          exit 0

      - name: Install dependencies
        run: |
          set -eux
          sudo apt-get update
          sudo apt-get install -y \
            adb bc bison build-essential curl fontconfig flex g++-multilib \
            gcc-multilib git gnupg gperf lib32ncurses-dev lib32z1-dev \
            libc6-dev-i386 libgl1-mesa-dev liblz4-tool libncurses5 \
            libncurses5-dev libssl-dev libx11-dev libxml2 libxml2-utils \
            lz4 lzop pngcrush python3 python-is-python3 rsync schedtool \
            squashfs-tools unzip x11proto-core-dev xsltproc xz-utils zip zlib1g-dev

      - name: Configure git
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@users.noreply.github.com"

      - name: Install repo
        run: |
          set -eux
          mkdir -p "${HOME}/bin"
          curl -L --retry 5 https://storage.googleapis.com/git-repo-downloads/repo \
            -o "${HOME}/bin/repo"
          chmod +x "${HOME}/bin/repo"
          echo "${HOME}/bin" >> "${GITHUB_PATH}"

      - name: Sync OrangeFox source
        run: |
          set -eu
          cd "${HOME}"
          rm -rf OrangeFox_sync fox_12.1
          for i in 1 2 3; do
            git clone --depth=1 https://gitlab.com/OrangeFox/sync.git OrangeFox_sync && break
            rm -rf OrangeFox_sync
            sleep 10
          done
          SYNC_SCRIPT="$(find "${HOME}/OrangeFox_sync" -name orangefox_sync.sh | head -n1)"
          [ -n "${SYNC_SCRIPT}" ] || { echo "sync script missing"; exit 1; }
          chmod +x "${SYNC_SCRIPT}"
          cd "$(dirname "${SYNC_SCRIPT}")"
          for i in 1 2 3; do
            ./orangefox_sync.sh --branch 12.1 --path "${HOME}/fox_12.1" && break
            sleep 30
          done
          [ -f "${HOME}/fox_12.1/build/envsetup.sh" ] || { echo "source sync failed"; exit 1; }

      - name: Sync mojito device tree
        run: |
          set -eu
          cd "${HOME}/fox_12.1"
          mkdir -p device/xiaomi
          rm -rf "device/xiaomi/${DEVICE_TREE}"
          if ! git clone --depth=1 -b "${FOX_BRANCH}" \
            "https://gitlab.com/OrangeFox/device/${DEVICE_TREE}.git" \
            "device/xiaomi/${DEVICE_TREE}"; then
            git clone --depth=1 -b "${FOX_BRANCH}" \
              "https://github.com/OrangeFox-Recovery-Devices/android_device_xiaomi_${DEVICE_TREE}_fox.git" \
              "device/xiaomi/${DEVICE_TREE}"
          fi
          [ -f "device/xiaomi/${DEVICE_TREE}/BoardConfig.mk" ] || { echo "mojito tree invalid"; exit 1; }

      - name: Compare OTG configuration with other devices
        run: |
          set -eu
          cd "${HOME}/fox_12.1"
          TREE="device/xiaomi/${DEVICE_TREE}"

          echo "===== Current mojito OTG configuration ====="
          grep -RInE --exclude-dir=.git \
            'usb[-_]otg|USB.OTG|TW_.*USB|OTG' "$TREE" || true

          echo "===== Reference OTG fstab entries ====="
          for REF in \
            "https://raw.githubusercontent.com/ljmf00-archive/android_device_xiaomi_grus-twrp/twrp-android-10.0/recovery.fstab" \
            "https://raw.githubusercontent.com/GeopJr/orangefox_device_xiaomi_davinci/android-9.0/recovery.fstab"; do
            echo "--- $REF ---"
            curl -fsSL "$REF" | grep -iE 'usb[-_]otg|USB.OTG' || true
          done

      - name: Add missing OTG storage entry
        if: ${{ inputs.force_otg }}
        run: |
          set -eu
          cd "${HOME}/fox_12.1"
          TREE="device/xiaomi/${DEVICE_TREE}"

          FSTAB="$(find "$TREE" -type f ( -iname 'recovery.fstab' -o -iname 'fstab.recovery' ) | head -n1 || true)"
          if [ -z "${FSTAB}" ]; then
            FSTAB="${TREE}/recovery/root/etc/recovery.fstab"
            mkdir -p "$(dirname "${FSTAB}")"
            touch "${FSTAB}"
          fi

          if grep -qiE 'usb[-_]otg' "${FSTAB}"; then
            echo "OTG entry already exists in ${FSTAB}"
          else
            cat >> "${FSTAB}" <<'EOF'

          # USB OTG removable storage
          /usb-otg auto /dev/block/sda1 /dev/block/sda flags=display="USB-OTG";storage;wipeingui;removable
          EOF
            echo "Added generic OTG entry to ${FSTAB}"
          fi

          echo "===== Final OTG entry ====="
          grep -nEi 'usb[-_]otg|USB.OTG' "${FSTAB}" || true

      - name: Add automatic OTG mount service
        if: ${{ inputs.force_otg }}
        run: |
          set -eu
          cd "${HOME}/fox_12.1"
          TREE="device/xiaomi/${DEVICE_TREE}"

          mkdir -p "${TREE}/recovery/root/system/bin"
          cat > "${TREE}/recovery/root/system/bin/usb_automount.sh" <<'EOF'
          #!/system/bin/sh
          MNT="/usb-otg"
          PREV=0
          OURS=0
          while true; do
            DEV=""
            for D in /dev/block/sda1 /dev/block/sdb1 /dev/block/sdc1 /dev/block/sdd1; do
              [ -b "$D" ] && DEV="$D" && break
            done
            if [ -n "$DEV" ]; then
              if [ "$PREV" = "0" ]; then
                sleep 2
                if ! grep -q " $MNT " /proc/mounts; then
                  mkdir -p "$MNT"
                  mount "$DEV" "$MNT" 2>/dev/null || \
                  mount -t vfat -o rw "$DEV" "$MNT" 2>/dev/null || \
                  mount -t exfat "$DEV" "$MNT" 2>/dev/null || \
                  mount -t ntfs "$DEV" "$MNT" 2>/dev/null || \
                  mount -t ext4 "$DEV" "$MNT" 2>/dev/null
                fi
                if grep -q " $MNT " /proc/mounts; then
                  PREV=1
                  OURS=1
                fi
              fi
            else
              if [ "$OURS" = "1" ]; then
                umount -l "$MNT" 2>/dev/null
                OURS=0
              fi
              PREV=0
            fi
            sleep 3
          done
          EOF

          chmod 755 "${TREE}/recovery/root/system/bin/usb_automount.sh"

          RC="${TREE}/recovery/root/init.recovery.qcom.rc"
          if [ ! -f "${RC}" ]; then
            RC="$(find "${TREE}" -type f -name 'init.recovery*.rc' | head -n1 || true)"
          fi
          if [ -z "${RC}" ]; then
            RC="${TREE}/recovery/root/init.recovery.qcom.rc"
            mkdir -p "$(dirname "${RC}")"
            touch "${RC}"
          fi

          if ! grep -q 'usbautomount' "${RC}"; then
            cat >> "${RC}" <<'EOF'

          service usbautomount /system/bin/sh /system/bin/usb_automount.sh
              user root
              group root
              disabled
              seclabel u:r:recovery:s0

          on boot
              start usbautomount
          EOF
          fi

      - name: Build OrangeFox
        run: |
          set -eo pipefail
          cd "${HOME}/fox_12.1"
          export FOX_BUILD_DEVICE="${DEVICE}"
          export OF_MAINTAINER="${MAINTAINER_NAME}"
          unset USE_CCACHE CCACHE_EXEC CCACHE_DIR FOX_VERSION

          source build/envsetup.sh
          [ -f "device/xiaomi/${DEVICE_TREE}/vendorsetup.sh" ] && \
            source "device/xiaomi/${DEVICE_TREE}/vendorsetup.sh" || true

          LUNCH_OK=""
          for PREFIX in fox twrp omni; do
            TARGET="${PREFIX}_${DEVICE}-eng"
            if lunch "${TARGET}"; then
              LUNCH_OK="${TARGET}"
              break
            fi
          done
          [ -n "${LUNCH_OK}" ] || { echo "No valid lunch target for ${DEVICE}"; exit 1; }

          if grep -rEqs "^s*(exports+)?(FOX_AB_DEVICE|FOX_VIRTUAL_AB_DEVICE|AB_OTA_UPDATER)s*:?=s*(1|true)" \
            "device/xiaomi/${DEVICE_TREE}"; then
            MAKE_TARGET="bootimage"
          else
            MAKE_TARGET="recoveryimage"
          fi

          mka adbd "${MAKE_TARGET}" -j"$(nproc)" 2>&1 | tee "${HOME}/build.log"

      - name: Upload OrangeFox
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-otg-storage
          if-no-files-found: error
          compression-level: 9
          path: |
            /home/runner/fox_12.1/out/target/product/mojito/recovery.img
            /home/runner/fox_12.1/out/target/product/mojito/boot.img
            /home/runner/fox_12.1/out/target/product/mojito/OrangeFox*.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-mojito-otg-storage
          if-no-files-found: ignore
          path: /home/runner/build.log
