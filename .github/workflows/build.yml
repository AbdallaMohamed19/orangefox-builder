name: Build OrangeFox 12.1 - mojito

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      FOX_PATH: ${{ github.workspace }}/fox_12.1

    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Free disk space
        run: |
          set -euxo pipefail

          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache

          sudo docker system prune -af || true

          df -h


      - name: Install dependencies
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            adb \
            bc \
            bison \
            build-essential \
            ccache \
            curl \
            flex \
            g++-multilib \
            gcc-multilib \
            git \
            git-lfs \
            gnupg \
            gperf \
            imagemagick \
            lib32ncurses5-dev \
            lib32readline-dev \
            lib32z1-dev \
            libelf-dev \
            liblz4-tool \
            libncurses5 \
            libncurses5-dev \
            libssl-dev \
            libxml2 \
            libxml2-utils \
            lzop \
            pngcrush \
            rsync \
            schedtool \
            squashfs-tools \
            unzip \
            xsltproc \
            zip \
            zlib1g-dev

          git lfs install

          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"


      - name: Install repo
        run: |
          set -euxo pipefail

          mkdir -p "$HOME/bin"

          curl -L \
            https://storage.googleapis.com/git-repo-downloads/repo \
            -o "$HOME/bin/repo"

          chmod +x "$HOME/bin/repo"

          echo "$HOME/bin" >> "$GITHUB_PATH"


      - name: Download OrangeFox sync script
        run: |
          set -euxo pipefail

          mkdir -p "$GITHUB_WORKSPACE/OrangeFox_sync"

          cd "$GITHUB_WORKSPACE/OrangeFox_sync"

          curl -L \
            https://gitlab.com/OrangeFox/sync/-/raw/master/orangefox_sync.sh \
            -o orangefox_sync.sh

          chmod +x orangefox_sync.sh

          test -s orangefox_sync.sh

          echo "OrangeFox sync script downloaded:"
          ls -lh orangefox_sync.sh

          echo ""
          echo "Script help:"
          ./orangefox_sync.sh --help || true


      - name: Sync OrangeFox 12.1
        run: |
          set -euxo pipefail

          rm -rf "$FOX_PATH"

          mkdir -p "$FOX_PATH"

          cd "$GITHUB_WORKSPACE/OrangeFox_sync"

          echo "============================================"
          echo "SYNCING ORANGEFOX 12.1"
          echo "============================================"

          ./orangefox_sync.sh \
            --branch 12.1 \
            --path "$FOX_PATH"


      - name: Verify OrangeFox source
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "VERIFY ORANGEFOX SOURCE"
          echo "============================================"

          test -d .repo
          test -f build/envsetup.sh

          echo "OrangeFox source is ready."

          echo ""
          echo "FOX_PATH:"
          pwd


      - name: Clone mojito device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p device/xiaomi

          rm -rf device/xiaomi/mojito

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_mojito.git \
            device/xiaomi/mojito

          test -f device/xiaomi/mojito/BoardConfig.mk

          echo "Mojito device tree OK."


      - name: Clone SM6150 common tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p device/xiaomi

          rm -rf device/xiaomi/sm6150-common

          git clone \
            --depth=1 \
            --branch android-12.1 \
            https://github.com/TeamWin/android_device_xiaomi_sm6150-common.git \
            device/xiaomi/sm6150-common

          echo "SM6150 common tree OK."


      - name: Clone mojito kernel
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          mkdir -p kernel/xiaomi

          rm -rf kernel/xiaomi/mojito

          git clone \
            --depth=1 \
            https://github.com/nebrassy/android_kernel_xiaomi_mojito.git \
            kernel/xiaomi/mojito

          test -f kernel/xiaomi/mojito/Makefile

          echo "Mojito kernel OK."


      - name: Check device tree
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          echo "============================================"
          echo "DEVICE TREE"
          echo "============================================"

          find device/xiaomi/mojito \
            -maxdepth 2 \
            -type f \
            -print | sort | head -100

          echo ""
          echo "============================================"
          echo "COMMON TREE"
          echo "============================================"

          find device/xiaomi/sm6150-common \
            -maxdepth 2 \
            -type f \
            -print | sort | head -100


      - name: Setup Android environment
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          echo "============================================"
          echo "LOADING ENVIRONMENT"
          echo "============================================"

          unset TOP
          unset OUT

          source build/envsetup.sh

          STATUS=$?

          echo ""
          echo "envsetup status: $STATUS"

          if [ "$STATUS" -ne 0 ]; then
            echo "envsetup failed"
            exit "$STATUS"
          fi


      - name: Lunch mojito
        shell: bash
        run: |
          set -euxo pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          unset TOP
          unset OUT

          source build/envsetup.sh

          lunch twrp_mojito-eng

          echo ""
          echo "============================================"
          echo "LUNCH RESULT"
          echo "============================================"

          echo "TARGET_PRODUCT=${TARGET_PRODUCT:-}"
          echo "TARGET_DEVICE=${TARGET_DEVICE:-}"
          echo "TARGET_BUILD_VARIANT=${TARGET_BUILD_VARIANT:-}"


      - name: Build OrangeFox
        shell: bash
        run: |
          set -o pipefail

          cd "$FOX_PATH"

          export ALLOW_MISSING_DEPENDENCIES=true
          export LC_ALL=C

          unset TOP
          unset OUT

          source build/envsetup.sh

          lunch twrp_mojito-eng

          echo ""
          echo "============================================"
          echo "BUILDING RECOVERY"
          echo "============================================"

          mka recoveryimage


      - name: Show build outputs
        if: always()
        shell: bash
        run: |
          set +e

          cd "$FOX_PATH"

          echo "============================================"
          echo "TARGET PRODUCT"
          echo "============================================"

          ls -lah out/target/product/mojito 2>/dev/null || true

          echo ""
          echo "============================================"
          echo "RECOVERY DIRECTORY"
          echo "============================================"

          find out/target/product/mojito/recovery \
            -type f \
            -print \
            2>/dev/null || true

          echo ""
          echo "============================================"
          echo "ALL IMG FILES"
          echo "============================================"

          find out \
            -type f \
            -name '*.img' \
            -print \
            2>/dev/null || true

          echo ""
          echo "============================================"
          echo "ALL ZIP FILES"
          echo "============================================"

          find out \
            -type f \
            -name '*.zip' \
            -print \
            2>/dev/null || true

          echo ""
          echo "============================================"
          echo "ALL RECOVERY FILES"
          echo "============================================"

          find out \
            -type f \
            \( \
              -iname '*recovery*' \
              -o \
              -iname '*orangefox*' \
            \) \
            -print \
            2>/dev/null || true


      - name: Upload OrangeFox artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OrangeFox-mojito-build
          path: |
            fox_12.1/out/**/*.img
            fox_12.1/out/**/*.zip
          if-no-files-found: warn
          retention-days: 7
