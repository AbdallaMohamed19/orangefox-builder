name: Build OrangeFox for Mojito

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Cleanup Environment
      run: |
        sudo rm -rf /usr/share/dotnet /etc/mysql /etc/php
        sudo apt-get remove -y ghc* zulu* hhvm llvm* firefox google-chrome* openjdk* dotnet* dotnet-runtime* powershell openjdk* mysql*
        sudo apt-get clean
        sudo rm -rf /usr/local/lib/android

    - name: Set up Build Environment
      run: |
        sudo apt update
        sudo apt install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32readline-dev lib32z1-dev libelf-dev liblz4-tool libncurses5 libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        export PATH=~/bin:$PATH

    - name: Sync OrangeFox Source & Device Tree
      run: |
        mkdir fox && cd fox
        ~/bin/repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_12.1 --depth=1
        ~/bin/repo sync -c --no-clone-bundle --no-tags -j$(nproc)
        git clone https://github.com/OrangeFox-Recovery-Devices/device_xiaomi_mojito.git -b fox_12.1 device/xiaomi/mojito

    - name: Build OrangeFox
      run: |
        cd fox
        source build/envsetup.sh
        export ALLOW_MISSING_DEPENDENCIES=true
        lunch omni_mojito-eng
        mka recoveryimage -j$(nproc)

    - name: Upload Recovery
      uses: actions/upload-artifact@v4
      with:
        name: OrangeFox-Mojito
        path: |
          fox/out/target/product/mojito/OrangeFox-*.zip
          fox/out/target/product/mojito/recovery.img
- name: Maximize build space
  uses: easimon/maximize-build-space@master
  with:
    remove-dotnet: 'true'
    remove-android: 'false'
    remove-haskell: 'true'
    remove-codeql: 'true'
    
